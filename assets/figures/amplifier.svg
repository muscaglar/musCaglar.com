<svg xmlns="http://www.w3.org/2000/svg" class="sketch" viewBox="0 0 240 180" role="img" aria-label="Circuit diagram of an amplifier that turns a small current into a voltage. Its feedback resistor is drawn in red.">
  <style>
    .sketch { fill: none; stroke-linecap: round; stroke-linejoin: round; color: var(--color-ink-2, #262c3a); font-family: var(--font-mono, "IBM Plex Mono", ui-monospace, Menlo, monospace); }
    .sketch text { fill: var(--color-ink-3, #6b7180); stroke: none; font-size: 9px; letter-spacing: 0.04em; }
    .sk-ink { stroke: currentColor; stroke-width: 1.25; }
    .sk-line { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; }
    .sk-dash { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; stroke-dasharray: 2 3; }
    .sk-accent { stroke: var(--color-accent, #b71c1c); stroke-width: 1.25; }
    .sk-atoms { stroke: currentColor; stroke-width: 4.5; stroke-dasharray: 0 9; }
    .sk-dot { fill: currentColor; stroke: none; }
    .sk-accent-dot { fill: var(--color-accent, #b71c1c); stroke: none; }
    .sk-hole { fill: var(--color-paper, #fbfaf7); stroke: currentColor; stroke-width: 1.25; }
    @media (prefers-color-scheme: dark) {
      .sketch { color: var(--color-ink-2, #d9dce3); }
      .sketch text { fill: var(--color-ink-3, #9aa0ad); }
      .sk-line, .sk-dash { stroke: var(--color-ink-3, #9aa0ad); }
      .sk-accent { stroke: var(--color-accent, #ef6a5e); }
      .sk-accent-dot { fill: var(--color-accent, #ef6a5e); }
      .sk-hole { fill: var(--color-paper, #14161b); }
    }
  </style>
  <!-- op-amp -->
  <path class="sk-ink" d="M96 64V136L160 100Z"/>
  <path class="sk-line" d="M102 82h6M102 118h6m-3-3v6"/>
  <!-- wires -->
  <path class="sk-ink" d="M28.5 82H96M64 82V40H92M128 40H184V100M160 100H213.5M96 118H64V148M56 148h16M59 152h10M62 156h4"/>
  <!-- feedback resistor -->
  <path class="sk-accent" d="M92 40l3-6l6 12l6-12l6 12l6-12l6 12l3-6"/>
  <!-- junctions and terminals -->
  <circle class="sk-dot" cx="64" cy="82" r="2"/>
  <circle class="sk-dot" cx="184" cy="100" r="2"/>
  <circle class="sk-hole" cx="26" cy="82" r="2.5"/>
  <circle class="sk-hole" cx="216" cy="100" r="2.5"/>
  <text x="110" y="25" text-anchor="middle">R</text>
  <text x="22" y="72">I in</text>
  <text x="220" y="90" text-anchor="end">V out</text>
  <text x="220" y="124" text-anchor="end">V = −I·R</text>
  <text x="78" y="156">0 V</text>
</svg>
