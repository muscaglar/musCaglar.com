<svg xmlns="http://www.w3.org/2000/svg" class="sketch" viewBox="0 0 240 180" role="img" aria-label="A moka pot cut in half: water in the base, ground coffee in the basket, brewed coffee in the top.">
  <style>
    .sketch { fill: none; stroke-linecap: round; stroke-linejoin: round; color: var(--color-ink-2, #262c3a); font-family: var(--font-mono, "IBM Plex Mono", ui-monospace, Menlo, monospace); }
    .sketch text { fill: var(--color-ink-3, #6b7180); stroke: none; font-size: 9px; letter-spacing: 0.04em; }
    .sk-ink { stroke: currentColor; stroke-width: 1.25; }
    .sk-line { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; }
    .sk-dash { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; stroke-dasharray: 2 3; }
    .sk-accent { stroke: var(--color-accent, #b71c1c); stroke-width: 1.25; }
    .sk-atoms { stroke: currentColor; stroke-width: 4.5; stroke-dasharray: 0 9; }
    .sk-dot { fill: currentColor; stroke: none; }
    .sk-accent-dot { fill: var(--color-accent, #b71c1c); stroke: none; }
    .sk-hole { fill: var(--color-paper, #fbfaf7); stroke: currentColor; stroke-width: 1.25; }
    @media (prefers-color-scheme: dark) {
      .sketch { color: var(--color-ink-2, #d9dce3); }
      .sketch text { fill: var(--color-ink-3, #9aa0ad); }
      .sk-line, .sk-dash { stroke: var(--color-ink-3, #9aa0ad); }
      .sk-accent { stroke: var(--color-accent, #ef6a5e); }
      .sk-accent-dot { fill: var(--color-accent, #ef6a5e); }
      .sk-hole { fill: var(--color-paper, #14161b); }
    }
  </style>
  <!-- boiler, collar, upper chamber, spout, lid, knob, handle -->
  <path class="sk-ink" d="M76 104L64 166H144L132 104M74 98h60v6H74zM76 98L62 40l-8-3M132 98L146 40M55 37.5L104 26L147 39.5"/>
  <circle class="sk-ink" cx="104" cy="21.5" r="3.5"/>
  <path class="sk-ink" d="M145.5 46H168q10 0 9 9l-5 43"/>
  <!-- funnel and basket; column -->
  <path class="sk-ink" d="M82 104V120L100 134V158M126 104V120L108 134V158M100 98V58M108 98V58M97 54h14"/>
  <path class="sk-dash" d="M82 120H126"/>
  <!-- liquid levels -->
  <path class="sk-line" d="M69 142H100M108 142H139M75 150h10M118 150h12M88 157h8M112 157h10M71.5 78H100M108 78H136.5M78 86h10M116 86h10"/>
  <!-- the grounds -->
  <path class="sk-accent" d="M84 119l8-14M92 119l8-14M100 119l8-14M108 119l8-14M116 119l8-14"/>
  <!-- leaders -->
  <path class="sk-line" d="M124 112H188M126 154H188M86 70H50"/>
  <text x="192" y="115">grounds</text>
  <text x="192" y="157">water</text>
  <text x="46" y="73" text-anchor="end">coffee</text>
</svg>
