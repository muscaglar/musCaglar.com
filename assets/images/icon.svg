    .ground { fill: #fbfaf7; } .atom { fill: #262c3a; } .strand { stroke: #b71c1c; }
    @media (prefers-color-scheme: dark) { .ground { fill: #1b1e25; } .atom { fill: #e8e9ec; } .strand { stroke: #ef6a5e; } }
  </style>
  <rect class="ground" width="64" height="64" rx="14"/>
  <circle class="atom" cx="10" cy="32" r="4.5"/>
  <circle class="atom" cx="21.5" cy="32" r="4.5"/>
  <circle class="atom" cx="42.5" cy="32" r="4.5"/>
  <circle class="atom" cx="54" cy="32" r="4.5"/>
  <path class="strand" d="M32 11V53" fill="none" stroke-width="6" stroke-linecap="round"/>
</svg>
