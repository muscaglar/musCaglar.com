# Builds the site and checks it on every push and pull request.
# Publishing is done by Cloudflare, which rebuilds the site whenever the live branch changes
# (see README.md, "Publishing"). This workflow is the safety net: it tells you when a change
# breaks the build, a link or a picture.

name: Build and check

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with build.sh.
  HUGO_VERSION: "0.166.0"
  HUGO_SHA256: "0e39b901e3f919f1daae05c8ff64f0c14c8a348ef46886d63f8e6d1bb2653885"
  TZ: Europe/London

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Hugo
        run: |
          archive="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -sfL --retry 3 -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${archive}"
          echo "${HUGO_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/hugo"
          tar -C "${RUNNER_TEMP}/hugo" -xf "${RUNNER_TEMP}/${archive}" hugo
          echo "${RUNNER_TEMP}/hugo" >> "${GITHUB_PATH}"
          echo "HUGO_CACHEDIR=${RUNNER_TEMP}/hugo_cache" >> "${GITHUB_ENV}"

      - name: Reuse pictures processed by earlier builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/hugo_cache
          key: hugo-${{ env.HUGO_VERSION }}-${{ github.run_id }}
          restore-keys: |
            hugo-${{ env.HUGO_VERSION }}-

      - name: Build the site as it will be published
        run: hugo build --gc --minify --panicOnWarning

      - name: Check the published site
        run: python3 scripts/check-site.py public

      - name: Build and check again with drafts included
        run: |
          hugo build --buildDrafts --buildFuture --minify --panicOnWarning --destination "${RUNNER_TEMP}/with-drafts"
          python3 scripts/check-site.py "${RUNNER_TEMP}/with-drafts"
