# The CV. This one file feeds the CV page (/cv/) and its printed version.
#
# How it works
#   - Sections appear on the page in the order they are listed under `sections`.
#   - Entries appear in the order they are written here, so put the newest first.
#   - `dates` is free text ("2016 – 2020", "Summer 2015", "2018"): write it the way you want it shown.
#     Dates only appear on the page while `showYears = true` in hugo.toml. They are kept here either way.
#   - Any field can be left out. Add `hide: true` to an entry or a section to keep it in this file
#     but off the page.
#   - Text accepts Markdown (links, *emphasis*).
#
# Kinds of section
#   timeline   dated entries with a title, an organisation and a few words     (experience, education)
#   compact    one line per entry: date and title                              (awards, talks)
#   list       plain entries, e.g. references to papers                        (publications)
#   groups     a label and a line of text                                      (skills)
#   prose      a paragraph

name: Mustafa Çağlar
headline: Ex-physicist, now engineer
# location: London, UK
# email: hello@muscaglar.com
website: https://muscaglar.com
links:
  - name: GitHub
    url: https://github.com/muscaglar
  - name: LinkedIn
    url: https://www.linkedin.com/in/musc/
  - name: Google Scholar
    url: https://scholar.google.com/citations?user=MPi8qAYAAAAJ

# summary: >-
#   Two or three sentences about what you do.

sections:
  - id: experience
    title: Experience
    kind: timeline
    entries:
      - dates: "20XX – present"
        title: Your role
        organisation: Organisation
        location: City
        summary: One or two sentences about what you do there.
        hide: true       # an example entry: fill it in and delete this line

  - id: education
    title: Education
    kind: timeline
    entries:
      - dates: "2016 – 2020"
        title: PhD in Physics
        organisation: University of Cambridge
      - dates: "2015 – 2016"
        title: MRes in Graphene Technology
        organisation: University of Cambridge
      - dates: "2011 – 2015"
        title: MEng in Electronic Engineering with Nanotechnology
        organisation: University of Southampton

  - id: publications
    title: Publications
    kind: list
    entries:
      - text: >-
          Caglar, M. *et al.* All-optical detection of neuronal membrane depolarization in
          live cells using colloidal quantum dots. *Nano Letters*.
        url: https://doi.org/10.1021/acs.nanolett.9b03026

  - id: skills
    title: Skills
    kind: groups
    hide: true           # an example section: fill it in and delete this line
    entries:
      - title: Languages
        text: Python, Swift, C++
