<li class="entry entry--recipe">
  <a class="entry-title" href="{{ .RelPermalink }}">{{ .Title }}</a>
  {{- if or .Params.time .Params.makes }}
  <span class="entry-meta">{{ with .Params.time }}{{ . }}{{ end }}{{ if and .Params.time .Params.makes }} · {{ end }}{{ with .Params.makes }}{{ . }}{{ end }}</span>
  {{- end }}
  {{- with .Params.summary }}
  <span class="entry-summary">{{ . }}</span>
  {{- end }}
</li>
