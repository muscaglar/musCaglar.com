{{- $page := .page -}}
{{- $image := partial "social-image.html" $page -}}
<meta property="og:site_name" content="{{ site.Title }}">
<meta property="og:title" content="{{ cond $page.IsHome site.Title $page.Title }}">
<meta property="og:description" content="{{ .description }}">
<meta property="og:url" content="{{ $page.Permalink }}">
<meta property="og:type" content="{{ cond $page.IsPage "article" "website" }}">
<meta property="og:locale" content="{{ replace site.Language.Locale "-" "_" }}">
{{- if and $page.IsPage (not $page.Date.IsZero) }}
<meta property="article:published_time" content="{{ $page.Date.Format "2006-01-02T15:04:05Z07:00" }}">
{{- end }}
{{- with $image }}
<meta property="og:image" content="{{ .Permalink }}">
<meta property="og:image:width" content="{{ .Width }}">
<meta property="og:image:height" content="{{ .Height }}">
<meta name="twitter:card" content="summary_large_image">
{{- else }}
<meta name="twitter:card" content="summary">
{{- end }}
