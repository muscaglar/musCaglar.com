<header class="site-header">
  <div class="sheet">
    <div class="site-header__row">
      <nav class="nav" aria-label="Sections">
        <a href="{{ site.Home.RelPermalink }}"{{ if .IsHome }} aria-current="page"{{ end }}>Home</a>
        {{- range partial "sections.html" . }}
        <a href="{{ .url }}"{{ with .current }} aria-current="{{ . }}"{{ end }}>{{ .name }}</a>
        {{- end }}
      </nav>
      <div class="site-header__aside">
        {{- with site.Params.links }}
        <ul>
          {{- range . }}
          <li><a href="{{ .url }}" rel="me noopener">{{ .short | default .name }}</a></li>
          {{- end }}
        </ul>
        {{- end }}
        {{ partial "theme-switch.html" . }}
      </div>
    </div>
  </div>
</header>
