<header class="site-header">
  <div class="sheet">
    <div class="site-header__row">
      <nav class="nav" aria-label="Sections">
        <a href="{{ site.Home.RelPermalink }}"{{ if .IsHome }} aria-current="page"{{ end }}>Home</a>
        {{- range partial "sections.html" . }}
        <a href="{{ .url }}"{{ with .current }} aria-current="{{ . }}"{{ end }}>{{ .name }}{{ with .count }} <span class="count">{{ . }}</span>{{ end }}</a>
        {{- end }}
      </nav>
      <div class="theme" role="group" aria-label="Theme">
        <button type="button" data-theme-set="auto" aria-pressed="true">Auto</button>
        <button type="button" data-theme-set="light" aria-pressed="false">Light</button>
        <button type="button" data-theme-set="dark" aria-pressed="false">Dark</button>
      </div>
    </div>
  </div>
</header>
