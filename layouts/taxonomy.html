{{ define "main" }}
<header class="page-head">
  <h1>{{ .Title }}</h1>
</header>
<ul class="tags tags--all">
  {{- range .Data.Terms.Alphabetical }}
  <li><a href="{{ .Page.RelPermalink }}" rel="tag">{{ .Page.LinkTitle }}</a> <span class="count">{{ .Count }}</span></li>
  {{- end }}
</ul>
{{ end }}
