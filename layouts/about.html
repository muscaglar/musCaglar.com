{{ define "main" }}
<article class="page page--about">
  <header class="page-head">
    <h1>{{ .Title }}</h1>
  </header>
  <div class="prose">
    {{ .Content }}
  </div>
  <ul class="site-links site-links--about">
    {{- with site.Params.email }}
    <li><a href="mailto:{{ . }}">{{ . }}</a></li>
    {{- end }}
    {{- range site.Params.links }}
    <li><a href="{{ .url }}" rel="me noopener">{{ .name }}</a></li>
    {{- end }}
  </ul>
</article>
{{ end }}
