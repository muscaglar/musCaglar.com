<svg xmlns="http://www.w3.org/2000/svg" class="sketch" viewBox="0 0 240 180" role="img" aria-label="A schematic of two reservoirs divided by a membrane, with a source electrode in one, a drain electrode in the other, and a gate terminal above the membrane.">
  <style>
    .sketch { fill: none; stroke-linecap: round; stroke-linejoin: round; color: var(--color-ink-2, #262c3a); font-family: var(--font-mono, "IBM Plex Mono", ui-monospace, Menlo, monospace); }
    .sketch text { fill: var(--color-ink-3, #6b7180); stroke: none; font-size: 9px; letter-spacing: 0.04em; }
    .sk-ink { stroke: currentColor; stroke-width: 1.25; }
    .sk-line { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; }
    .sk-dash { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; stroke-dasharray: 2 3; }
    .sk-accent { stroke: var(--color-accent, #b71c1c); stroke-width: 1.25; }
    .sk-dot { fill: currentColor; stroke: none; }
    .sk-accent-dot { fill: var(--color-accent, #b71c1c); stroke: none; }
    .sk-hole { fill: var(--color-paper, #fbfaf7); stroke: currentColor; stroke-width: 1.25; }
    @media (prefers-color-scheme: dark) {
      .sketch { color: var(--color-ink-2, #d9dce3); }
      .sketch text { fill: var(--color-ink-3, #9aa0ad); }
      .sk-line, .sk-dash { stroke: var(--color-ink-3, #9aa0ad); }
      .sk-accent { stroke: var(--color-accent, #ef6a5e); }
      .sk-accent-dot { fill: var(--color-accent, #ef6a5e); }
      .sk-hole { fill: var(--color-paper, #14161b); }
    }
  </style>
  <!-- tank -->
  <path class="sk-ink" d="M40 64V148H200V64"/>
  <!-- liquid level, broken round the electrodes -->
  <path class="sk-line" d="M40 76H66M78 76H114M126 76H162M174 76H200"/>
  <!-- membrane, drawn whole: the sources do not describe its structure -->
  <path class="sk-ink" d="M120 60V148"/>
  <!-- source and drain electrodes, leads and terminals -->
  <path class="sk-ink" d="M69 96h6v28h-6zM72 96V35M165 96h6v28h-6zM168 96V35"/>
  <circle class="sk-ink" cx="72" cy="32" r="3"/>
  <circle class="sk-ink" cx="168" cy="32" r="3"/>
  <!-- ion current from one side to the other, broken at the membrane -->
  <path class="sk-line" d="M84 112H114M126 112H156M152 109l4 3l-4 3"/>
  <!-- the gate: a third terminal above the membrane, not touching it -->
  <g class="sk-accent">
    <path d="M120 54V35M115 54H125"/>
    <circle cx="120" cy="32" r="3"/>
  </g>
  <text x="72" y="20" text-anchor="middle">source</text>
  <text x="120" y="20" text-anchor="middle">gate</text>
  <text x="168" y="20" text-anchor="middle">drain</text>
  <text x="120" y="166" text-anchor="middle">membrane</text>
</svg>
