<svg xmlns="http://www.w3.org/2000/svg" class="sketch" viewBox="0 0 240 180" role="img" aria-label="The same web page in two browser windows: laid out as designed on the left, and with one box out of the frame in an old browser on the right, as an example of a break.">
  <style>
    .sketch { fill: none; stroke-linecap: round; stroke-linejoin: round; color: var(--color-ink-2, #262c3a); font-family: var(--font-mono, "IBM Plex Mono", ui-monospace, Menlo, monospace); }
    .sketch text { fill: var(--color-ink-3, #6b7180); stroke: none; font-size: 9px; letter-spacing: 0.04em; }
    .sk-ink { stroke: currentColor; stroke-width: 1.25; }
    .sk-line { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; }
    .sk-dash { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; stroke-dasharray: 2 3; }
    .sk-accent { stroke: var(--color-accent, #b71c1c); stroke-width: 1.25; }
    .sk-dot { fill: currentColor; stroke: none; }
    .sk-accent-dot { fill: var(--color-accent, #b71c1c); stroke: none; }
    .sk-hole { fill: var(--color-paper, #fbfaf7); stroke: currentColor; stroke-width: 1.25; }
    @media (prefers-color-scheme: dark) {
      .sketch { color: var(--color-ink-2, #d9dce3); }
      .sketch text { fill: var(--color-ink-3, #9aa0ad); }
      .sk-line, .sk-dash { stroke: var(--color-ink-3, #9aa0ad); }
      .sk-accent { stroke: var(--color-accent, #ef6a5e); }
      .sk-accent-dot { fill: var(--color-accent, #ef6a5e); }
      .sk-hole { fill: var(--color-paper, #14161b); }
    }
  </style>

  <!-- two browser windows -->
  <path class="sk-ink" d="M16 22H112V126H16ZM16 34H112M128 22H224V126H128ZM128 34H224"/>
  <circle class="sk-dot" cx="22" cy="28" r="1.5"/>
  <circle class="sk-dot" cx="27" cy="28" r="1.5"/>
  <circle class="sk-dot" cx="32" cy="28" r="1.5"/>
  <circle class="sk-dot" cx="134" cy="28" r="1.5"/>
  <circle class="sk-dot" cx="139" cy="28" r="1.5"/>
  <circle class="sk-dot" cx="144" cy="28" r="1.5"/>
  <!-- the page as designed -->
  <path class="sk-line" d="M24 42H104V52H24ZM24 60H46V84H24ZM53 60H75V84H53ZM82 60H104V84H82Z"/>
  <path class="sk-line" d="M24 94H104M24 102H104M24 110H80"/>
  <!-- the page in an old browser -->
  <path class="sk-line" d="M136 42H216V52H136ZM136 60H158V84H136ZM136 88H158V112H136Z"/>
  <path class="sk-line" d="M166 64H216M166 72H216M166 80H198"/>
  <!-- the part that falls out of the frame -->
  <path class="sk-hole" d="M136 116H158V140H136Z"/>
  <path class="sk-accent" d="M136 116H158V140H136Z"/>
  <!-- labels -->
  <text x="64" y="160" text-anchor="middle">as designed</text>
  <text x="176" y="160" text-anchor="middle">old browser</text>
</svg>
