<svg xmlns="http://www.w3.org/2000/svg" class="sketch" viewBox="0 0 240 180" role="img" aria-label="A block diagram: an experiment feeds a database, the database feeds the analysis, and the results are stored as well.">
  <style>
    .sketch { fill: none; stroke-linecap: round; stroke-linejoin: round; color: var(--color-ink-2, #262c3a); font-family: var(--font-mono, "IBM Plex Mono", ui-monospace, Menlo, monospace); }
    .sketch text { fill: var(--color-ink-3, #6b7180); stroke: none; font-size: 9px; letter-spacing: 0.04em; }
    .sk-ink { stroke: currentColor; stroke-width: 1.25; }
    .sk-line { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; }
    .sk-dash { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; stroke-dasharray: 2 3; }
    .sk-accent { stroke: var(--color-accent, #b71c1c); stroke-width: 1.25; }
    .sk-dot { fill: currentColor; stroke: none; }
    .sk-accent-dot { fill: var(--color-accent, #b71c1c); stroke: none; }
    .sk-hole { fill: var(--color-paper, #fbfaf7); stroke: currentColor; stroke-width: 1.25; }
    @media (prefers-color-scheme: dark) {
      .sketch { color: var(--color-ink-2, #d9dce3); }
      .sketch text { fill: var(--color-ink-3, #9aa0ad); }
      .sk-line, .sk-dash { stroke: var(--color-ink-3, #9aa0ad); }
      .sk-accent { stroke: var(--color-accent, #ef6a5e); }
      .sk-accent-dot { fill: var(--color-accent, #ef6a5e); }
      .sk-hole { fill: var(--color-paper, #14161b); }
    }
  </style>

  <!-- experiment: an instrument with a trace -->
  <path class="sk-ink" d="M18 68H70V108H18Z"/>
  <path class="sk-line" d="M25 94H35L39 78L44 100L48 90H63"/>
  <!-- analysis: a plot -->
  <path class="sk-ink" d="M172 66V108H222"/>
  <path class="sk-line" d="M179 101.5L217 71.5"/>
  <circle class="sk-dot" cx="183" cy="96" r="1.5"/>
  <circle class="sk-dot" cx="190" cy="91" r="1.5"/>
  <circle class="sk-dot" cx="198" cy="88" r="1.5"/>
  <circle class="sk-dot" cx="205" cy="79" r="1.5"/>
  <circle class="sk-dot" cx="213" cy="77.5" r="1.5"/>
  <!-- flow of data -->
  <path class="sk-line" d="M77 88H91M87 84.5L91 88L87 91.5M150 88H164M160 84.5L164 88L160 91.5"/>
  <path class="sk-line" d="M197 116V130M193.5 126L197 130L200.5 126"/>
  <!-- the database -->
  <g class="sk-accent">
    <ellipse cx="120" cy="70" rx="22" ry="6"/>
    <path d="M98 70V106A22 6 0 0 0 142 106V70M98 82A22 6 0 0 0 142 82M98 94A22 6 0 0 0 142 94"/>
  </g>
  <!-- labels -->
  <text x="44" y="56" text-anchor="middle">experiment</text>
  <text x="120" y="56" text-anchor="middle">database</text>
  <text x="197" y="56" text-anchor="middle">analysis</text>
  <text x="197" y="144" text-anchor="middle">results</text>
</svg>
