<svg xmlns="http://www.w3.org/2000/svg" class="sketch" viewBox="0 0 240 180" role="img" aria-label="A section through a part on a printer bed, built up in layers, with the nozzle laying down the top layer.">
  <style>
    .sketch { fill: none; stroke-linecap: round; stroke-linejoin: round; color: var(--color-ink-2, #262c3a); font-family: var(--font-mono, "IBM Plex Mono", ui-monospace, Menlo, monospace); }
    .sketch text { fill: var(--color-ink-3, #6b7180); stroke: none; font-size: 9px; letter-spacing: 0.04em; }
    .sk-ink { stroke: currentColor; stroke-width: 1.25; }
    .sk-line { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; }
    .sk-dash { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; stroke-dasharray: 2 3; }
    .sk-accent { stroke: var(--color-accent, #b71c1c); stroke-width: 1.25; }
    .sk-dot { fill: currentColor; stroke: none; }
    .sk-accent-dot { fill: var(--color-accent, #b71c1c); stroke: none; }
    .sk-hole { fill: var(--color-paper, #fbfaf7); stroke: currentColor; stroke-width: 1.25; }
    @media (prefers-color-scheme: dark) {
      .sketch { color: var(--color-ink-2, #d9dce3); }
      .sketch text { fill: var(--color-ink-3, #9aa0ad); }
      .sk-line, .sk-dash { stroke: var(--color-ink-3, #9aa0ad); }
      .sk-accent { stroke: var(--color-accent, #ef6a5e); }
      .sk-accent-dot { fill: var(--color-accent, #ef6a5e); }
      .sk-hole { fill: var(--color-paper, #14161b); }
    }
  </style>

  <!-- bed -->
  <path class="sk-ink" d="M36 146H196V154H36Z"/>
  <!-- layers already printed -->
  <rect class="sk-ink" x="66" y="140" width="100" height="6" rx="3"/>
  <rect class="sk-ink" x="66" y="134" width="100" height="6" rx="3"/>
  <rect class="sk-ink" x="66" y="128" width="100" height="6" rx="3"/>
  <rect class="sk-ink" x="78" y="122" width="76" height="6" rx="3"/>
  <rect class="sk-ink" x="78" y="116" width="76" height="6" rx="3"/>
  <rect class="sk-ink" x="90" y="110" width="52" height="6" rx="3"/>
  <rect class="sk-ink" x="90" y="104" width="52" height="6" rx="3"/>
  <!-- nozzle, heater block and filament -->
  <path class="sk-ink" d="M114 98H118L125 86H107ZM103 66H129V86H103Z"/>
  <path class="sk-line" d="M116 66V16"/>
  <!-- the layer being printed -->
  <path class="sk-accent" d="M114 98H93A3 3 0 0 0 93 104H116"/>
  <!-- leaders and labels -->
  <path class="sk-line" d="M120 30H150M133 76H150M170 131H186M200 150H208"/>
  <text x="154" y="33">filament</text>
  <text x="154" y="79">nozzle</text>
  <text x="190" y="134">layers</text>
  <text x="212" y="153">bed</text>
</svg>
