<svg xmlns="http://www.w3.org/2000/svg" class="sketch" viewBox="0 0 240 180" role="img" aria-label="An invented plan of two courtyards with food stalls, and the queue at one of them.">
  <style>
    .sketch { fill: none; stroke-linecap: round; stroke-linejoin: round; color: var(--color-ink-2, #262c3a); font-family: var(--font-mono, "IBM Plex Mono", ui-monospace, Menlo, monospace); }
    .sketch text { fill: var(--color-ink-3, #6b7180); stroke: none; font-size: 9px; letter-spacing: 0.04em; }
    .sk-ink { stroke: currentColor; stroke-width: 1.25; }
    .sk-line { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; }
    .sk-dash { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; stroke-dasharray: 2 3; }
    .sk-accent { stroke: var(--color-accent, #b71c1c); stroke-width: 1.25; }
    .sk-dot { fill: currentColor; stroke: none; }
    .sk-accent-dot { fill: var(--color-accent, #b71c1c); stroke: none; }
    .sk-hole { fill: var(--color-paper, #fbfaf7); stroke: currentColor; stroke-width: 1.25; }
    @media (prefers-color-scheme: dark) {
      .sketch { color: var(--color-ink-2, #d9dce3); }
      .sketch text { fill: var(--color-ink-3, #9aa0ad); }
      .sk-line, .sk-dash { stroke: var(--color-ink-3, #9aa0ad); }
      .sk-accent { stroke: var(--color-accent, #ef6a5e); }
      .sk-accent-dot { fill: var(--color-accent, #ef6a5e); }
      .sk-hole { fill: var(--color-paper, #14161b); }
    }
  </style>

  <!-- buildings around two courts, with an entrance and a passage; an invented plan -->
  <path class="sk-ink" d="M54 153H20V27H220V153H66M54 153V139M66 153V139"/>
  <path class="sk-ink" d="M54 139H34V41H112V83M112 95V139H66"/>
  <path class="sk-ink" d="M126 83V41H206V139H126V95M112 83H126M112 95H126"/>
  <!-- stalls -->
  <path class="sk-ink" d="M178 85h8v8h-8zM42 53h8v8h-8zM140 51h8v8h-8zM150 119h8v8h-8zM84 111h8v8h-8z"/>
  <!-- the queue -->
  <g>
    <circle class="sk-accent-dot" cx="172" cy="89" r="2"/>
    <circle class="sk-accent-dot" cx="166" cy="89" r="2"/>
    <circle class="sk-accent-dot" cx="160" cy="89" r="2"/>
    <circle class="sk-accent-dot" cx="154" cy="89" r="2"/>
    <circle class="sk-accent-dot" cx="148" cy="89" r="2"/>
  </g>
  <!-- labels -->
  <text x="160" y="79" text-anchor="middle">queue</text>
  <text x="182" y="107" text-anchor="middle">stall</text>
  <text x="80" y="63" text-anchor="middle">court</text>
</svg>
