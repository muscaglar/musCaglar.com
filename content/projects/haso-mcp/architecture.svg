<svg xmlns="http://www.w3.org/2000/svg" class="sketch" viewBox="0 0 480 270" role="img" aria-label="The path of a request. Two clients, each with a key of its own, reach Home Assistant only through the server: a gate, the resolving of targets, the policy decision and the executor. The decision is written to the audit log first. A press of a button reaches the policy through Home Assistant.">
  <style>
    .sketch { fill: none; stroke-linecap: round; stroke-linejoin: round; color: var(--color-ink-2, #262c3a); font-family: var(--font-mono, "IBM Plex Mono", ui-monospace, Menlo, monospace); }
    .sketch text { fill: var(--color-ink-3, #6b7180); stroke: none; font-size: 9px; letter-spacing: 0.04em; }
    .sk-ink { stroke: currentColor; stroke-width: 1.25; }
    .sk-line { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; }
    .sk-dash { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; stroke-dasharray: 2 3; }
    .sk-accent { stroke: var(--color-accent, #b71c1c); stroke-width: 1.25; }
    .sk-dot { fill: currentColor; stroke: none; }
    .sk-accent-dot { fill: var(--color-accent, #b71c1c); stroke: none; }
    .sk-hole { fill: var(--color-paper, #fbfaf7); stroke: currentColor; stroke-width: 1.25; }
    @media (prefers-color-scheme: dark) {
      .sketch { color: var(--color-ink-2, #d9dce3); }
      .sketch text { fill: var(--color-ink-3, #9aa0ad); }
      .sk-line, .sk-dash { stroke: var(--color-ink-3, #9aa0ad); }
      .sk-accent { stroke: var(--color-accent, #ef6a5e); }
      .sk-accent-dot { fill: var(--color-accent, #ef6a5e); }
      .sk-hole { fill: var(--color-paper, #14161b); }
    }
  </style>
  <!-- the clients, each with a key of its own -->
  <path class="sk-ink" d="M12 72H92V106H12ZM12 152H92V186H12Z"/>
  <!-- the server: everything inside the dashed frame -->
  <path class="sk-dash" d="M116 28H396V246H116Z"/>
  <!-- the stages a request passes, in order -->
  <path class="sk-ink" d="M130 112H178V146H130ZM196 112H252V146H196ZM344 112H384V146H344Z"/>
  <!-- the decision: the one place that says yes, ask, or never -->
  <path class="sk-accent" d="M270 106H326V152H270Z"/>
  <!-- the audit log, written before anything runs -->
  <path class="sk-ink" d="M270 196H326V224H270Z"/>
  <!-- home assistant, and the button it reports -->
  <path class="sk-ink" d="M408 106H472V152H408Z"/>
  <circle class="sk-hole" cx="440" cy="206" r="7"/>
  <circle class="sk-dot" cx="440" cy="206" r="2.5"/>
  <!-- the way in, and on -->
  <path class="sk-line" d="M92 89H108V129H130M92 169H108V129M178 129H196M252 129H270M326 129H344M384 129H408M298 152V196"/>
  <path class="sk-line" d="M126 126.5L130 129L126 131.5M192 126.5L196 129L192 131.5M266 126.5L270 129L266 131.5M340 126.5L344 129L340 131.5M404 126.5L408 129L404 131.5M295.5 192L298 196L300.5 192"/>
  <!-- what the button says comes back through home assistant, never from a client -->
  <path class="sk-dash" d="M440 199V152M440 106V64H298V106"/>
  <path class="sk-line" d="M295.5 102L298 106L300.5 102"/>
  <text x="52" y="92" text-anchor="middle">voice node</text>
  <text x="52" y="172" text-anchor="middle">laptop tool</text>
  <text x="52" y="126" text-anchor="middle">a key each</text>
  <text x="124" y="44">the server</text>
  <text x="154" y="132" text-anchor="middle">gate</text>
  <text x="224" y="132" text-anchor="middle">resolve</text>
  <text x="298" y="132" text-anchor="middle">policy</text>
  <text x="364" y="132" text-anchor="middle">run</text>
  <text x="290" y="174" text-anchor="end">alone · witness · never</text>
  <text x="298" y="213" text-anchor="middle">audit log</text>
  <text x="440" y="126" text-anchor="middle">home</text>
  <text x="440" y="138" text-anchor="middle">assistant</text>
  <text x="440" y="228" text-anchor="middle">button</text>
  <text x="388" y="56" text-anchor="end">seen by the server</text>
</svg>
