<svg xmlns="http://www.w3.org/2000/svg" class="sketch" viewBox="0 0 240 180" role="img" aria-label="An invented week of classes drawn as a grid of days against time of day, with open and full classes and one class booked.">
  <style>
    .sketch { fill: none; stroke-linecap: round; stroke-linejoin: round; color: var(--color-ink-2, #262c3a); font-family: var(--font-mono, "IBM Plex Mono", ui-monospace, Menlo, monospace); }
    .sketch text { fill: var(--color-ink-3, #6b7180); stroke: none; font-size: 9px; letter-spacing: 0.04em; }
    .sk-ink { stroke: currentColor; stroke-width: 1.25; }
    .sk-line { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; }
    .sk-dash { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; stroke-dasharray: 2 3; }
    .sk-accent { stroke: var(--color-accent, #b71c1c); stroke-width: 1.25; }
    .sk-dot { fill: currentColor; stroke: none; }
    .sk-accent-dot { fill: var(--color-accent, #b71c1c); stroke: none; }
    .sk-hole { fill: var(--color-paper, #fbfaf7); stroke: currentColor; stroke-width: 1.25; }
    @media (prefers-color-scheme: dark) {
      .sketch { color: var(--color-ink-2, #d9dce3); }
      .sketch text { fill: var(--color-ink-3, #9aa0ad); }
      .sk-line, .sk-dash { stroke: var(--color-ink-3, #9aa0ad); }
      .sk-accent { stroke: var(--color-accent, #ef6a5e); }
      .sk-accent-dot { fill: var(--color-accent, #ef6a5e); }
      .sk-hole { fill: var(--color-paper, #14161b); }
    }
  </style>
  <!-- axes: seven days across, time of day down -->
  <path class="sk-line" d="M16 154V38H170M16 35v3M38 35v3M60 35v3M82 35v3M104 35v3M126 35v3M148 35v3M170 35v3M13 51.5h3M13 69.5h3M13 87.5h3M13 105.5h3M13 123.5h3M13 141.5h3"/>
  <!-- open classes, monday to sunday -->
  <g class="sk-ink">
    <rect x="19" y="64" width="16" height="11" rx="2"/>
    <rect x="19" y="118" width="16" height="11" rx="2"/>
    <rect x="19" y="136" width="16" height="11" rx="2"/>
    <rect x="41" y="46" width="16" height="11" rx="2"/>
    <rect x="41" y="64" width="16" height="11" rx="2"/>
    <rect x="41" y="82" width="16" height="11" rx="2"/>
    <rect x="41" y="118" width="16" height="11" rx="2"/>
    <rect x="41" y="136" width="16" height="11" rx="2"/>
    <rect x="63" y="46" width="16" height="11" rx="2"/>
    <rect x="63" y="64" width="16" height="11" rx="2"/>
    <rect x="63" y="136" width="16" height="11" rx="2"/>
    <rect x="85" y="46" width="16" height="11" rx="2"/>
    <rect x="85" y="64" width="16" height="11" rx="2"/>
    <rect x="85" y="82" width="16" height="11" rx="2"/>
    <rect x="107" y="46" width="16" height="11" rx="2"/>
    <rect x="107" y="64" width="16" height="11" rx="2"/>
    <rect x="129" y="64" width="16" height="11" rx="2"/>
    <rect x="129" y="82" width="16" height="11" rx="2"/>
    <rect x="129" y="100" width="16" height="11" rx="2"/>
    <rect x="151" y="82" width="16" height="11" rx="2"/>
    <rect x="151" y="100" width="16" height="11" rx="2"/>
  </g>
  <!-- full classes -->
  <!-- four straight strokes each, corners left open, so that every side begins and ends with a dash -->
  <g class="sk-dash">
    <path d="M21 46H33M35 48V55M33 57H21M19 55V48M65 118H77M79 120V127M77 129H65M63 127V120M153 64H165M167 66V73M165 75H153M151 73V66"/>
  </g>
  <!-- the booked class -->
  <rect class="sk-accent" x="85" y="118" width="16" height="11" rx="2"/>
  <!-- leaders -->
  <path class="sk-line" d="M171 69.5H184M171 87.5H184M105 123.5H184"/>
  <text x="27" y="31" text-anchor="middle">mon</text>
  <text x="159" y="31" text-anchor="middle">sun</text>
  <text x="188" y="72.5">full</text>
  <text x="188" y="90.5">open</text>
  <text x="188" y="126.5">booked</text>
</svg>
