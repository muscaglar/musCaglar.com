<svg xmlns="http://www.w3.org/2000/svg" class="sketch" viewBox="0 0 240 180" role="img" aria-label="A sketch of current against voltage: illustrative points, the straight line of Ohm's law, and a curved model.">
  <style>
    .sketch { fill: none; stroke-linecap: round; stroke-linejoin: round; color: var(--color-ink-2, #262c3a); font-family: var(--font-mono, "IBM Plex Mono", ui-monospace, Menlo, monospace); }
    .sketch text { fill: var(--color-ink-3, #6b7180); stroke: none; font-size: 9px; letter-spacing: 0.04em; }
    .sk-ink { stroke: currentColor; stroke-width: 1.25; }
    .sk-line { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; }
    .sk-dash { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; stroke-dasharray: 2 3; }
    .sk-accent { stroke: var(--color-accent, #b71c1c); stroke-width: 1.25; }
    .sk-dot { fill: currentColor; stroke: none; }
    .sk-accent-dot { fill: var(--color-accent, #b71c1c); stroke: none; }
    .sk-hole { fill: var(--color-paper, #fbfaf7); stroke: currentColor; stroke-width: 1.25; }
    @media (prefers-color-scheme: dark) {
      .sketch { color: var(--color-ink-2, #d9dce3); }
      .sketch text { fill: var(--color-ink-3, #9aa0ad); }
      .sk-line, .sk-dash { stroke: var(--color-ink-3, #9aa0ad); }
      .sk-accent { stroke: var(--color-accent, #ef6a5e); }
      .sk-accent-dot { fill: var(--color-accent, #ef6a5e); }
      .sk-hole { fill: var(--color-paper, #14161b); }
    }
  </style>

  <!-- axes -->
  <path class="sk-line" d="M28 30V150H212"/>
  <!-- illustrative points -->
  <circle class="sk-dot" cx="48" cy="124.5" r="1.5"/>
  <circle class="sk-dot" cx="57" cy="130" r="1.5"/>
  <circle class="sk-dot" cx="66" cy="122" r="1.5"/>
  <circle class="sk-dot" cx="75" cy="127.5" r="1.5"/>
  <circle class="sk-dot" cx="84" cy="119.5" r="1.5"/>
  <circle class="sk-dot" cx="93" cy="124" r="1.5"/>
  <circle class="sk-dot" cx="102" cy="114.5" r="1.5"/>
  <circle class="sk-dot" cx="111" cy="118" r="1.5"/>
  <circle class="sk-dot" cx="120" cy="107" r="1.5"/>
  <circle class="sk-dot" cx="129" cy="108.5" r="1.5"/>
  <circle class="sk-dot" cx="138" cy="96" r="1.5"/>
  <circle class="sk-dot" cx="147" cy="95" r="1.5"/>
  <circle class="sk-dot" cx="156" cy="79.5" r="1.5"/>
  <circle class="sk-dot" cx="165" cy="76" r="1.5"/>
  <circle class="sk-dot" cx="174" cy="58" r="1.5"/>
  <circle class="sk-dot" cx="183" cy="53" r="1.5"/>
  <circle class="sk-dot" cx="192" cy="34.5" r="1.5"/>
  <!-- ohm's law: a straight line -->
  <path class="sk-ink" d="M50 141L200 51.5"/>
  <!-- the fitted model -->
  <path class="sk-accent" d="M44 128C46.5 127.5 54 127 59 126.5C64.5 126 69.5 125 74.5 124.5C79.5 123.5 84.5 122.5 89.5 121.5C94.5 120.5 99.5 119 105 117C110 115.5 115 113.5 120 110.5C125 108 130 105 135 101C140.5 97.5 145.5 93 150.5 88.5C155.5 83.5 160.5 78 165.5 72C170.5 66 175.5 59.5 181 53C186 46.5 193.5 35.5 196 32"/>
  <!-- leaders and labels -->
  <path class="sk-line" d="M100 108.5V58M142 100V127"/>
  <text x="100" y="52" text-anchor="middle">ohm's law</text>
  <text x="142" y="139" text-anchor="middle">fitted model</text>
  <text x="28" y="22">current</text>
  <text x="212" y="164" text-anchor="end">voltage</text>
</svg>
