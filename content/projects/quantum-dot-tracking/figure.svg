<svg xmlns="http://www.w3.org/2000/svg" class="sketch" viewBox="0 0 240 180" role="img" aria-label="A stack of microscope frames with a circle drawn round each bright dot, and the brightness inside one circle plotted against frame number.">
  <style>
    .sketch { fill: none; stroke-linecap: round; stroke-linejoin: round; color: var(--color-ink-2, #262c3a); font-family: var(--font-mono, "IBM Plex Mono", ui-monospace, Menlo, monospace); }
    .sketch text { fill: var(--color-ink-3, #6b7180); stroke: none; font-size: 9px; letter-spacing: 0.04em; }
    .sk-ink { stroke: currentColor; stroke-width: 1.25; }
    .sk-line { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; }
    .sk-dash { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; stroke-dasharray: 2 3; }
    .sk-accent { stroke: var(--color-accent, #b71c1c); stroke-width: 1.25; }
    .sk-dot { fill: currentColor; stroke: none; }
    .sk-accent-dot { fill: var(--color-accent, #b71c1c); stroke: none; }
    .sk-hole { fill: var(--color-paper, #fbfaf7); stroke: currentColor; stroke-width: 1.25; }
    @media (prefers-color-scheme: dark) {
      .sketch { color: var(--color-ink-2, #d9dce3); }
      .sketch text { fill: var(--color-ink-3, #9aa0ad); }
      .sk-line, .sk-dash { stroke: var(--color-ink-3, #9aa0ad); }
      .sk-accent { stroke: var(--color-accent, #ef6a5e); }
      .sk-accent-dot { fill: var(--color-accent, #ef6a5e); }
      .sk-hole { fill: var(--color-paper, #14161b); }
    }
  </style>
  <!-- the frames behind -->
  <path class="sk-line" d="M22 50V44H106V128H100M28 44V38H112V122H106"/>
  <!-- the front frame -->
  <path class="sk-ink" d="M16 50H100V134H16z"/>
  <!-- the dots and their regions -->
  <circle class="sk-dot" cx="34" cy="70" r="1.5"/>
  <circle class="sk-dot" cx="60" cy="64" r="1.5"/>
  <circle class="sk-dot" cx="82" cy="80" r="1.5"/>
  <circle class="sk-dot" cx="56" cy="92" r="1.5"/>
  <circle class="sk-dot" cx="34" cy="114" r="1.5"/>
  <circle class="sk-dot" cx="78" cy="116" r="1.5"/>
  <circle class="sk-ink" cx="34" cy="70" r="6"/>
  <circle class="sk-ink" cx="60" cy="64" r="6"/>
  <circle class="sk-ink" cx="82" cy="80" r="6"/>
  <circle class="sk-ink" cx="56" cy="92" r="6"/>
  <circle class="sk-ink" cx="78" cy="116" r="6"/>
  <!-- axes -->
  <path class="sk-line" d="M136 50V134H228M118 92H130M126 89l4 3l-4 3"/>
  <!-- one region and the light inside it, frame by frame -->
  <g class="sk-accent">
    <circle cx="34" cy="114" r="6"/>
    <path d="M141 112L147 110L153 113L159 109L165 111L171 104L175 78L179 68L184 82L190 97L197 105L204 108L211 106L218 109L224 107"/>
  </g>
  <!-- leaders -->
  <path class="sk-line" d="M34 121V140"/>
  <text x="28" y="30">frames</text>
  <text x="34" y="151" text-anchor="middle">region</text>
  <text x="136" y="42">brightness</text>
  <text x="228" y="151" text-anchor="end">frame</text>
</svg>
