<svg xmlns="http://www.w3.org/2000/svg" class="sketch" viewBox="0 0 240 180" role="img" aria-label="An invented daily signal graphed over fourteen days with its mean, and today's reading standing above that mean.">
  <style>
    .sketch { fill: none; stroke-linecap: round; stroke-linejoin: round; color: var(--color-ink-2, #262c3a); font-family: var(--font-mono, "IBM Plex Mono", ui-monospace, Menlo, monospace); }
    .sketch text { fill: var(--color-ink-3, #6b7180); stroke: none; font-size: 9px; letter-spacing: 0.04em; }
    .sk-ink { stroke: currentColor; stroke-width: 1.25; }
    .sk-line { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; }
    .sk-dash { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; stroke-dasharray: 2 3; }
    .sk-accent { stroke: var(--color-accent, #b71c1c); stroke-width: 1.25; }
    .sk-dot { fill: currentColor; stroke: none; }
    .sk-accent-dot { fill: var(--color-accent, #b71c1c); stroke: none; }
    .sk-hole { fill: var(--color-paper, #fbfaf7); stroke: currentColor; stroke-width: 1.25; }
    @media (prefers-color-scheme: dark) {
      .sketch { color: var(--color-ink-2, #d9dce3); }
      .sketch text { fill: var(--color-ink-3, #9aa0ad); }
      .sk-line, .sk-dash { stroke: var(--color-ink-3, #9aa0ad); }
      .sk-accent { stroke: var(--color-accent, #ef6a5e); }
      .sk-accent-dot { fill: var(--color-accent, #ef6a5e); }
      .sk-hole { fill: var(--color-paper, #14161b); }
    }
  </style>
  <!-- axes -->
  <path class="sk-line" d="M24 30V134H216"/>
  <!-- the mean of the baseline window -->
  <path class="sk-dash" d="M24 90H194"/>
  <!-- fourteen baseline days -->
  <path class="sk-ink" d="M34 78L45 99L56 108L67 84L78 69L89 94.5L100 105L111 75L122 87L133 111L144 97.5L155 72L166 81L177 99"/>
  <g class="sk-dot"><circle cx="34" cy="78" r="2"/><circle cx="45" cy="99" r="2"/><circle cx="56" cy="108" r="2"/><circle cx="67" cy="84" r="2"/><circle cx="78" cy="69" r="2"/><circle cx="89" cy="94.5" r="2"/><circle cx="100" cy="105" r="2"/><circle cx="111" cy="75" r="2"/><circle cx="122" cy="87" r="2"/><circle cx="133" cy="111" r="2"/><circle cx="144" cy="97.5" r="2"/><circle cx="155" cy="72" r="2"/><circle cx="166" cy="81" r="2"/><circle cx="177" cy="99" r="2"/></g>
  <!-- today, measured from the mean -->
  <g>
    <path class="sk-accent" d="M188 90V58.5M185 90H191"/>
    <circle class="sk-accent-dot" cx="188" cy="56" r="2.5"/>
  </g>
  <!-- the baseline window -->
  <path class="sk-line" d="M34 141V145H177V141"/>
  <text x="24" y="21">signal</text>
  <text x="199" y="93">mean</text>
  <text x="188" y="47" text-anchor="middle">today</text>
  <text x="105.5" y="159" text-anchor="middle">14-day baseline</text>
</svg>
