<svg xmlns="http://www.w3.org/2000/svg" class="sketch" viewBox="0 0 240 180" role="img" aria-label="Outline of a pocket computer: the a key is marked on its keyboard grid and the hiragana for a is on its small screen.">
  <style>
    .sketch { fill: none; stroke-linecap: round; stroke-linejoin: round; color: var(--color-ink-2, #262c3a); font-family: var(--font-mono, "IBM Plex Mono", ui-monospace, Menlo, monospace); }
    .sketch text { fill: var(--color-ink-3, #6b7180); stroke: none; font-size: 9px; letter-spacing: 0.04em; }
    .sk-ink { stroke: currentColor; stroke-width: 1.25; }
    .sk-line { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; }
    .sk-dash { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; stroke-dasharray: 2 3; }
    .sk-accent { stroke: var(--color-accent, #b71c1c); stroke-width: 1.25; }
    .sk-dot { fill: currentColor; stroke: none; }
    .sk-accent-dot { fill: var(--color-accent, #b71c1c); stroke: none; }
    .sk-hole { fill: var(--color-paper, #fbfaf7); stroke: currentColor; stroke-width: 1.25; }
    @media (prefers-color-scheme: dark) {
      .sketch { color: var(--color-ink-2, #d9dce3); }
      .sketch text { fill: var(--color-ink-3, #9aa0ad); }
      .sk-line, .sk-dash { stroke: var(--color-ink-3, #9aa0ad); }
      .sk-accent { stroke: var(--color-accent, #ef6a5e); }
      .sk-accent-dot { fill: var(--color-accent, #ef6a5e); }
      .sk-hole { fill: var(--color-paper, #14161b); }
    }
  </style>
  <!-- case and screen -->
  <rect class="sk-ink" x="12" y="30" width="176" height="112" rx="6"/>
  <rect class="sk-ink" x="106" y="39" width="71" height="40"/>
  <!-- controller module -->
  <rect class="sk-line" x="23" y="39" width="38" height="26"/>
  <!-- keyboard: 4 rows of 14 keys -->
  <rect class="sk-ink" x="23" y="88" width="154" height="44"/>
  <path class="sk-line" d="M34 88V132M45 88V132M56 88V132M67 88V132M78 88V132M89 88V132M100 88V132M111 88V132M122 88V132M133 88V132M144 88V132M155 88V132M166 88V132M23 99H177M23 110H177M23 121H177"/>
  <!-- the a key -->
  <circle class="sk-dot" cx="50.5" cy="115.5" r="2.5"/>
  <!-- the kana on the screen -->
  <path class="sk-accent" d="M131.5 52.5L149 51M139 46A80 80 0 0 0 139 70M146.5 56L132.5 68.5A11 8 0 1 1 141.5 72.5"/>
  <!-- leaders -->
  <path class="sk-line" d="M158 59H200M50.5 115.5V150.5M42 44V21.5"/>
  <text x="204" y="62">kana</text>
  <text x="50.5" y="161" text-anchor="middle">romaji</text>
  <text x="42" y="17" text-anchor="middle">esp32-s3</text>
</svg>
