<svg xmlns="http://www.w3.org/2000/svg" class="sketch" viewBox="0 0 240 180" role="img" aria-label="A current trace against time with one brief drop below a threshold, marked with its depth and its duration.">
  <style>
    .sketch { fill: none; stroke-linecap: round; stroke-linejoin: round; color: var(--color-ink-2, #262c3a); font-family: var(--font-mono, "IBM Plex Mono", ui-monospace, Menlo, monospace); }
    .sketch text { fill: var(--color-ink-3, #6b7180); stroke: none; font-size: 9px; letter-spacing: 0.04em; }
    .sk-ink { stroke: currentColor; stroke-width: 1.25; }
    .sk-line { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; }
    .sk-dash { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; stroke-dasharray: 2 3; }
    .sk-accent { stroke: var(--color-accent, #b71c1c); stroke-width: 1.25; }
    .sk-dot { fill: currentColor; stroke: none; }
    .sk-accent-dot { fill: var(--color-accent, #b71c1c); stroke: none; }
    .sk-hole { fill: var(--color-paper, #fbfaf7); stroke: currentColor; stroke-width: 1.25; }
    @media (prefers-color-scheme: dark) {
      .sketch { color: var(--color-ink-2, #d9dce3); }
      .sketch text { fill: var(--color-ink-3, #9aa0ad); }
      .sk-line, .sk-dash { stroke: var(--color-ink-3, #9aa0ad); }
      .sk-accent { stroke: var(--color-accent, #ef6a5e); }
      .sk-accent-dot { fill: var(--color-accent, #ef6a5e); }
      .sk-hole { fill: var(--color-paper, #14161b); }
    }
  </style>
  <!-- axes -->
  <path class="sk-line" d="M32 28V152H212"/>
  <!-- detection threshold -->
  <path class="sk-dash" d="M40 80H76M92 80H208"/>
  <!-- open-pore current, before and after -->
  <path class="sk-ink" d="M40 56L46 55L52 57L58 55.5L64 56.5L70 55L76 57L82 56L88 55.5L94 56.5L100 56M144 56L150 57L156 55L162 56.5L168 55.5L174 57L180 55L186 56.5L192 55.5L198 57L204 56"/>
  <!-- the event -->
  <path class="sk-accent" d="M100 56L102 112L108 111L114 113L120 111.5L126 112.5L132 111L138 113L142 112L144 56"/>
  <!-- depth -->
  <path class="sk-line" d="M84 59.5V112M81 59.5H87M81 112H87"/>
  <!-- duration -->
  <path class="sk-line" d="M102 126H142M102 123V129M142 123V129"/>
  <text x="32" y="18">current</text>
  <text x="212" y="167" text-anchor="end">time</text>
  <text x="208" y="72.5" text-anchor="end">threshold</text>
  <text x="76" y="101" text-anchor="end">depth</text>
  <text x="122" y="142" text-anchor="middle">duration</text>
</svg>
