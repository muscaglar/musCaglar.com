<svg xmlns="http://www.w3.org/2000/svg" class="sketch" viewBox="0 0 240 180" role="img" aria-label="A block diagram: three devices from three different makers on one shared line, with one small bridge joined to the same line.">
  <style>
    .sketch { fill: none; stroke-linecap: round; stroke-linejoin: round; color: var(--color-ink-2, #262c3a); font-family: var(--font-mono, "IBM Plex Mono", ui-monospace, Menlo, monospace); }
    .sketch text { fill: var(--color-ink-3, #6b7180); stroke: none; font-size: 9px; letter-spacing: 0.04em; }
    .sk-ink { stroke: currentColor; stroke-width: 1.25; }
    .sk-line { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; }
    .sk-dash { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; stroke-dasharray: 2 3; }
    .sk-accent { stroke: var(--color-accent, #b71c1c); stroke-width: 1.25; }
    .sk-dot { fill: currentColor; stroke: none; }
    .sk-accent-dot { fill: var(--color-accent, #b71c1c); stroke: none; }
    .sk-hole { fill: var(--color-paper, #fbfaf7); stroke: currentColor; stroke-width: 1.25; }
    @media (prefers-color-scheme: dark) {
      .sketch { color: var(--color-ink-2, #d9dce3); }
      .sketch text { fill: var(--color-ink-3, #9aa0ad); }
      .sk-line, .sk-dash { stroke: var(--color-ink-3, #9aa0ad); }
      .sk-accent { stroke: var(--color-accent, #ef6a5e); }
      .sk-accent-dot { fill: var(--color-accent, #ef6a5e); }
      .sk-hole { fill: var(--color-paper, #14161b); }
    }
  </style>

  <!-- three devices: plain boxes, one mark in each -->
  <path class="sk-ink" d="M34 42h28v28H34zM106 42h28v28H106zM178 42h28v28H178z"/>
  <circle class="sk-line" cx="48" cy="56" r="6"/>
  <path class="sk-line" d="M120 49L127 56L120 63L113 56Z"/>
  <path class="sk-line" d="M184 56H200"/>
  <!-- one shared line; the bridge hangs from it -->
  <path class="sk-dash" d="M48 70V92M192 70V92M120 70V112M120 92H48M120 92H192"/>
  <!-- the bridge: a small computer -->
  <g>
    <path class="sk-accent" d="M98 112H142V142H98Z"/>
    <circle class="sk-accent-dot" cx="108" cy="119" r="1.5"/>
    <circle class="sk-accent-dot" cx="114" cy="119" r="1.5"/>
    <circle class="sk-accent-dot" cx="120" cy="119" r="1.5"/>
    <circle class="sk-accent-dot" cx="126" cy="119" r="1.5"/>
    <circle class="sk-accent-dot" cx="132" cy="119" r="1.5"/>
  </g>
  <!-- labels -->
  <text x="48" y="32" text-anchor="middle">light</text>
  <text x="120" y="32" text-anchor="middle">device</text>
  <text x="192" y="32" text-anchor="middle">speaker</text>
  <text x="120" y="158" text-anchor="middle">homebridge</text>
</svg>
