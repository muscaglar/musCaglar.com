<svg xmlns="http://www.w3.org/2000/svg" class="sketch" viewBox="0 0 240 180" role="img" aria-label="The tip of a capillary in section with a sheet of graphene or boron nitride sealed across it; positive ions, drawn as dots, pass through a pore in the sheet and negative ions, drawn as rings, stay behind.">
  <style>
    .sketch { fill: none; stroke-linecap: round; stroke-linejoin: round; color: var(--color-ink-2, #262c3a); font-family: var(--font-mono, "IBM Plex Mono", ui-monospace, Menlo, monospace); }
    .sketch text { fill: var(--color-ink-3, #6b7180); stroke: none; font-size: 9px; letter-spacing: 0.04em; }
    .sk-ink { stroke: currentColor; stroke-width: 1.25; }
    .sk-line { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; }
    .sk-dash { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; stroke-dasharray: 2 3; }
    .sk-accent { stroke: var(--color-accent, #b71c1c); stroke-width: 1.25; }
    .sk-dot { fill: currentColor; stroke: none; }
    .sk-accent-dot { fill: var(--color-accent, #b71c1c); stroke: none; }
    .sk-hole { fill: var(--color-paper, #fbfaf7); stroke: currentColor; stroke-width: 1.25; }
    @media (prefers-color-scheme: dark) {
      .sketch { color: var(--color-ink-2, #d9dce3); }
      .sketch text { fill: var(--color-ink-3, #9aa0ad); }
      .sk-line, .sk-dash { stroke: var(--color-ink-3, #9aa0ad); }
      .sk-accent { stroke: var(--color-accent, #ef6a5e); }
      .sk-accent-dot { fill: var(--color-accent, #ef6a5e); }
      .sk-hole { fill: var(--color-paper, #14161b); }
    }
  </style>
  <!-- the capillary, cut along its length -->
  <path class="sk-ink" d="M16 48L136.5 76V82L16 60zM16 132L136.5 104V98L16 120z"/>
  <!-- positive ions: filled dots -->
  <g class="sk-dot">
    <circle cx="60" cy="82" r="2.5"/>
    <circle cx="40" cy="100" r="2.5"/>
    <circle cx="112" cy="90" r="2.5"/>
    <circle cx="164" cy="90" r="2.5"/>
    <circle cx="196" cy="104" r="2.5"/>
    <circle cx="188" cy="70" r="2.5"/>
  </g>
  <!-- negative ions: open rings -->
  <g class="sk-ink">
    <circle cx="76" cy="100" r="2.5"/>
    <circle cx="94" cy="84" r="2.5"/>
  </g>
  <!-- the way through -->
  <path class="sk-dash" d="M118.5 90H155"/>
  <path class="sk-line" d="M151 87l4 3l-4 3"/>
  <!-- the membrane, one atom thick, with a pore, against the end faces of the capillary -->
  <path class="sk-accent" d="M137.5 60V86.5M137.5 93.5V120"/>
  <!-- leaders -->
  <path class="sk-line" d="M137.5 56V45M76 104.5V130M140.5 94.5L152 130M196 108.5V130"/>
  <text x="16" y="38">capillary</text>
  <text x="130" y="38">graphene or hbn</text>
  <text x="76" y="141" text-anchor="middle">anion</text>
  <text x="152" y="141" text-anchor="middle">pore</text>
  <text x="196" y="141" text-anchor="middle">cation</text>
</svg>
