<svg xmlns="http://www.w3.org/2000/svg" class="sketch" viewBox="0 0 240 180" role="img" aria-label="An invented plan of ponds beside a railway line; one pond has a ring drawn around it, and the recorded sightings that fall inside the ring are counted.">
  <style>
    .sketch { fill: none; stroke-linecap: round; stroke-linejoin: round; color: var(--color-ink-2, #262c3a); font-family: var(--font-mono, "IBM Plex Mono", ui-monospace, Menlo, monospace); }
    .sketch text { fill: var(--color-ink-3, #6b7180); stroke: none; font-size: 9px; letter-spacing: 0.04em; }
    .sk-ink { stroke: currentColor; stroke-width: 1.25; }
    .sk-line { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; }
    .sk-dash { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; stroke-dasharray: 2 3; }
    .sk-accent { stroke: var(--color-accent, #b71c1c); stroke-width: 1.25; }
    .sk-dot { fill: currentColor; stroke: none; }
    .sk-accent-dot { fill: var(--color-accent, #b71c1c); stroke: none; }
    .sk-hole { fill: var(--color-paper, #fbfaf7); stroke: currentColor; stroke-width: 1.25; }
    @media (prefers-color-scheme: dark) {
      .sketch { color: var(--color-ink-2, #d9dce3); }
      .sketch text { fill: var(--color-ink-3, #9aa0ad); }
      .sk-line, .sk-dash { stroke: var(--color-ink-3, #9aa0ad); }
      .sk-accent { stroke: var(--color-accent, #ef6a5e); }
      .sk-accent-dot { fill: var(--color-accent, #ef6a5e); }
      .sk-hole { fill: var(--color-paper, #14161b); }
    }
  </style>

  <!-- railway line with sleepers -->
  <path class="sk-ink" d="M12 153C90 153 150 133 228 97"/>
  <path class="sk-line" d="M16.5 150L16.5 156M26 150L26 156M34.5 149.5L35 155.5M43.5 149L44 155M52.5 148L53 154M61.5 147L62 153M70 146L71 152M79 144.5L80 150.5M87.5 143L89 149M96.5 141L98 147M105.5 139L106.5 145M114 137L115.5 143M122.5 134.5L124 140.5M131 132L133 138M140 129.5L141.5 135M148 126.5L150 132.5M156.5 123.5L158.5 129.5M165 120.5L167 126M173.5 117.5L175.5 123M181.5 114L183.5 119.5M190 110.5L192.5 116M198.5 107L200.5 112.5M206.5 103.5L209 109M214.5 100L217 105.5M222.5 96L225 101.5"/>
  <!-- ponds -->
  <path class="sk-ink" d="M84 71C84 66 90 64.5 94 65.5C99 66.5 101.5 70 100 74C99 77.5 92 77 88 76C85 75 84 74 84 71Z"/>
  <path class="sk-ink" d="M172.5 29C172.5 25.5 176.5 24.5 179.5 25C183 26 184.5 28.5 183.5 31C183 33.5 178 33 175 32.5C173 32 172.5 31 172.5 29Z"/>
  <path class="sk-ink" d="M25 35C25 32 29 31 31 31.5C34 32.5 35.5 34.5 35 37C34 39 30 38.5 27.5 38C26 37.5 25 37 25 35Z"/>
  <path class="sk-ink" d="M207.5 137C207.5 133 212.5 132 215.5 132.5C219.5 133.5 221.5 136 220.5 139.5C219.5 142 214 142 211 141C208.5 140 207.5 139.5 207.5 137Z"/>
  <!-- recorded sightings -->
  <circle class="sk-dot" cx="76" cy="57" r="1.5"/>
  <circle class="sk-dot" cx="106" cy="59" r="1.5"/>
  <circle class="sk-dot" cx="103" cy="88" r="1.5"/>
  <circle class="sk-dot" cx="79" cy="87" r="1.5"/>
  <circle class="sk-dot" cx="40" cy="115" r="1.5"/>
  <circle class="sk-dot" cx="150" cy="103" r="1.5"/>
  <!-- the ring around the pond being scored -->
  <circle class="sk-accent" cx="92" cy="71" r="30"/>
  <!-- leaders and labels -->
  <path class="sk-line" d="M122 71H140M188 29H198"/>
  <text x="144" y="74">counted nearby</text>
  <text x="202" y="32">pond</text>
  <text x="40" y="131" text-anchor="middle">sighting</text>
  <text x="136" y="149">railway</text>
</svg>
