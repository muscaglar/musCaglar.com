<svg xmlns="http://www.w3.org/2000/svg" class="sketch" viewBox="0 0 240 180" role="img" aria-label="Three food items, each drawn as a low-to-high range on an energy scale, add up to the wider range shown for the whole meal.">
  <style>
    .sketch { fill: none; stroke-linecap: round; stroke-linejoin: round; color: var(--color-ink-2, #262c3a); font-family: var(--font-mono, "IBM Plex Mono", ui-monospace, Menlo, monospace); }
    .sketch text { fill: var(--color-ink-3, #6b7180); stroke: none; font-size: 9px; letter-spacing: 0.04em; }
    .sk-ink { stroke: currentColor; stroke-width: 1.25; }
    .sk-line { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; }
    .sk-dash { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; stroke-dasharray: 2 3; }
    .sk-accent { stroke: var(--color-accent, #b71c1c); stroke-width: 1.25; }
    .sk-dot { fill: currentColor; stroke: none; }
    .sk-accent-dot { fill: var(--color-accent, #b71c1c); stroke: none; }
    .sk-hole { fill: var(--color-paper, #fbfaf7); stroke: currentColor; stroke-width: 1.25; }
    @media (prefers-color-scheme: dark) {
      .sketch { color: var(--color-ink-2, #d9dce3); }
      .sketch text { fill: var(--color-ink-3, #9aa0ad); }
      .sk-line, .sk-dash { stroke: var(--color-ink-3, #9aa0ad); }
      .sk-accent { stroke: var(--color-accent, #ef6a5e); }
      .sk-accent-dot { fill: var(--color-accent, #ef6a5e); }
      .sk-hole { fill: var(--color-paper, #14161b); }
    }
  </style>
  <!-- zero line, energy axis with even ticks, row ticks -->
  <path class="sk-line" d="M56 20V150H228M56 150v4M98 150v4M140 150v4M182 150v4M224 150v4M52 32h4M52 50h4M52 68h4M52 116h4"/>
  <!-- sum rule between the items and the meal -->
  <path class="sk-line" d="M64 86H228"/>
  <!-- three items: low cap, range, high cap; the third is a low-confidence item with a wider band -->
  <path class="sk-ink" d="M75.5 28.5v7M75.5 32H91M91 28.5v7M83 46.5v7M83 50H104M104 46.5v7M84 64.5v7M84 68H122M122 64.5v7"/>
  <circle class="sk-dot" cx="82" cy="32" r="2"/>
  <circle class="sk-dot" cx="92" cy="50" r="2"/>
  <circle class="sk-dot" cx="100" cy="68" r="2"/>
  <!-- guides from the meal's low and high down to the scale -->
  <path class="sk-dash" d="M130.5 124V150M205 124V150"/>
  <!-- the meal: lows, estimates and highs summed -->
  <g>
    <path class="sk-accent" d="M130.5 111.5v9M130.5 116H205M205 111.5v9"/>
    <circle class="sk-accent-dot" cx="162" cy="116" r="2.5"/>
  </g>
  <text x="46" y="53" text-anchor="end">items</text>
  <text x="46" y="119" text-anchor="end">meal</text>
  <text x="130.5" y="104" text-anchor="middle">low</text>
  <text x="205" y="104" text-anchor="middle">high</text>
  <text x="228" y="168" text-anchor="end">kcal</text>
</svg>
