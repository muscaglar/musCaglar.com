<svg xmlns="http://www.w3.org/2000/svg" class="sketch" viewBox="0 0 240 180" role="img" aria-label="Block diagram: a command leaves Home Assistant, goes up to the cloud service behind the maker's app and comes down to the air conditioner, because there is no local path between the two.">
  <style>
    .sketch { fill: none; stroke-linecap: round; stroke-linejoin: round; color: var(--color-ink-2, #262c3a); font-family: var(--font-mono, "IBM Plex Mono", ui-monospace, Menlo, monospace); }
    .sketch text { fill: var(--color-ink-3, #6b7180); stroke: none; font-size: 9px; letter-spacing: 0.04em; }
    .sk-ink { stroke: currentColor; stroke-width: 1.25; }
    .sk-line { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; }
    .sk-dash { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; stroke-dasharray: 2 3; }
    .sk-accent { stroke: var(--color-accent, #b71c1c); stroke-width: 1.25; }
    .sk-dot { fill: currentColor; stroke: none; }
    .sk-accent-dot { fill: var(--color-accent, #b71c1c); stroke: none; }
    .sk-hole { fill: var(--color-paper, #fbfaf7); stroke: currentColor; stroke-width: 1.25; }
    @media (prefers-color-scheme: dark) {
      .sketch { color: var(--color-ink-2, #d9dce3); }
      .sketch text { fill: var(--color-ink-3, #9aa0ad); }
      .sk-line, .sk-dash { stroke: var(--color-ink-3, #9aa0ad); }
      .sk-accent { stroke: var(--color-accent, #ef6a5e); }
      .sk-accent-dot { fill: var(--color-accent, #ef6a5e); }
      .sk-hole { fill: var(--color-paper, #14161b); }
    }
  </style>
  <!-- cloud service: a rack of three -->
  <path class="sk-ink" d="M94 38h52v28H94z"/>
  <path class="sk-line" d="M94 47.5h52M94 56.5h52"/>
  <circle class="sk-dot" cx="101" cy="43" r="1.5"/>
  <circle class="sk-dot" cx="101" cy="52" r="1.5"/>
  <circle class="sk-dot" cx="101" cy="61" r="1.5"/>
  <!-- home assistant: a small computer -->
  <path class="sk-ink" d="M38 106h40v32H38z"/>
  <path class="sk-line" d="M44.5 130h14"/>
  <circle class="sk-dot" cx="70.5" cy="113.5" r="1.5"/>
  <!-- the air conditioner, with its flap -->
  <path class="sk-ink" d="M162 106h40v32H162z"/>
  <path class="sk-line" d="M168.5 125.5h27M168.5 130.5h27"/>
  <circle class="sk-dot" cx="194.5" cy="113.5" r="1.5"/>
  <!-- no direct path between the two -->
  <path class="sk-dash" d="M80 124H160"/>
  <!-- the path of one command -->
  <g class="sk-accent">
    <path d="M58 105V58a6 6 0 0 1 6-6H92.5"/>
    <path d="M88 48.5L92.5 52L88 55.5"/>
    <path d="M147.5 52H176a6 6 0 0 1 6 6V104.5"/>
    <path d="M178.5 100L182 104.5L185.5 100"/>
  </g>
  <text x="120" y="31" text-anchor="middle">cloud service</text>
  <text x="120" y="116" text-anchor="middle">no local api</text>
  <text x="58" y="153" text-anchor="middle">home assistant</text>
  <text x="182" y="153" text-anchor="middle">air conditioner</text>
</svg>
