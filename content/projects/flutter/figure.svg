<svg xmlns="http://www.w3.org/2000/svg" class="sketch" viewBox="0 0 240 180" role="img" aria-label="A graph of brightness against time: a row of breaths that grow longer, from eleven a minute to six, and whose peaks sink to dark at the end.">
  <style>
    .sketch { fill: none; stroke-linecap: round; stroke-linejoin: round; color: var(--color-ink-2, #262c3a); font-family: var(--font-mono, "IBM Plex Mono", ui-monospace, Menlo, monospace); }
    .sketch text { fill: var(--color-ink-3, #6b7180); stroke: none; font-size: 9px; letter-spacing: 0.04em; }
    .sk-ink { stroke: currentColor; stroke-width: 1.25; }
    .sk-line { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; }
    .sk-dash { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; stroke-dasharray: 2 3; }
    .sk-accent { stroke: var(--color-accent, #b71c1c); stroke-width: 1.25; }
    .sk-dot { fill: currentColor; stroke: none; }
    .sk-accent-dot { fill: var(--color-accent, #b71c1c); stroke: none; }
    .sk-hole { fill: var(--color-paper, #fbfaf7); stroke: currentColor; stroke-width: 1.25; }
    @media (prefers-color-scheme: dark) {
      .sketch { color: var(--color-ink-2, #d9dce3); }
      .sketch text { fill: var(--color-ink-3, #9aa0ad); }
      .sk-line, .sk-dash { stroke: var(--color-ink-3, #9aa0ad); }
      .sk-accent { stroke: var(--color-accent, #ef6a5e); }
      .sk-accent-dot { fill: var(--color-accent, #ef6a5e); }
      .sk-hole { fill: var(--color-paper, #14161b); }
    }
  </style>
  <!-- axes: brightness up, time along -->
  <path class="sk-line" d="M20 38V136H201"/>
  <!-- the top of each breath: level, then sinking to the last peak -->
  <path class="sk-dash" d="M129.5 54H143C155 54 167 90.5 178.5 114.5"/>
  <!-- the light: nine breaths, each 40 percent rise, 52 fall, 8 rest -->
  <path class="sk-accent" d="M20 136C22 136 23.5 54 25.5 54C28.5 54 30.5 136 33 136H34C36.5 136 38 54 40 54C43 54 45 136 47.5 136H48.5C51 136 52.5 54 55 54C57.5 54 60 136 62.5 136H64C66.5 136 68 54 70.5 54C73.5 54 76 136 79 136H80.5C83 136 85 54 87.5 54C91 54 93.5 136 97 136H98.5C101.5 136 104 54 107 54C111 54 114 136 118 136H119.5C123 136 125.5 54 129.5 54C134 54 137.5 136 142 136H144C147.5 136 150.5 63 154 63C158 63 162 136 168 136H170C172.5 136 175 114.5 178.5 114.5C182 114.5 183 136 194 136H196"/>
  <!-- the length of one breath, early and late -->
  <path class="sk-line" d="M20 144H34M20 141.5V146.5M34 141.5V146.5M144 144H170M144 141.5V146.5M170 141.5V146.5"/>
  <text x="20" y="30">brightness</text>
  <text x="143" y="44" text-anchor="middle">fade to dark</text>
  <text x="20" y="161">11 a minute</text>
  <text x="157" y="161" text-anchor="middle">6 a minute</text>
  <text x="205" y="139">time</text>
</svg>
