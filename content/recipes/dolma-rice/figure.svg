<svg xmlns="http://www.w3.org/2000/svg" class="sketch" viewBox="0 0 240 180" role="img" aria-label="A round dish seen from above, with rice, vermicelli, cranberries and feta spread out in it. A dashed outline stands for the dolma that is not there.">
  <style>
    .sketch { fill: none; stroke-linecap: round; stroke-linejoin: round; color: var(--color-ink-2, #262c3a); font-family: var(--font-mono, "IBM Plex Mono", ui-monospace, Menlo, monospace); }
    .sketch text { fill: var(--color-ink-3, #6b7180); stroke: none; font-size: 9px; letter-spacing: 0.04em; }
    .sk-ink { stroke: currentColor; stroke-width: 1.25; }
    .sk-line { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; }
    .sk-dash { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; stroke-dasharray: 2 3; }
    .sk-accent { stroke: var(--color-accent, #b71c1c); stroke-width: 1.25; }
    .sk-dot { fill: currentColor; stroke: none; }
    .sk-accent-dot { fill: var(--color-accent, #b71c1c); stroke: none; }
    .sk-hole { fill: var(--color-paper, #fbfaf7); stroke: currentColor; stroke-width: 1.25; }
    @media (prefers-color-scheme: dark) {
      .sketch { color: var(--color-ink-2, #d9dce3); }
      .sketch text { fill: var(--color-ink-3, #9aa0ad); }
      .sk-line, .sk-dash { stroke: var(--color-ink-3, #9aa0ad); }
      .sk-accent { stroke: var(--color-accent, #ef6a5e); }
      .sk-accent-dot { fill: var(--color-accent, #ef6a5e); }
      .sk-hole { fill: var(--color-paper, #14161b); }
    }
  </style>
  <!-- the dish, from above: rim and well -->
  <circle class="sk-ink" cx="76" cy="90" r="62"/>
  <circle class="sk-line" cx="76" cy="90" r="55"/>
  <!-- the dolma that is not there, drawn as the outline of a leaf with its stalk -->
  <path class="sk-dash" d="M76 118L99.5 130.5L112 101.5L121.5 71.5L96 60L76 41L56 60L30.5 71.5L40 101.5L52.5 130.5ZM76 118V138"/>
  <!-- rice -->
  <path class="sk-ink" d="M84.5 96L80.5 97M87.5 78.5L87.5 82.5M66.5 73L70.5 74M91 92L93 96M86 70L82 71M57.5 75.5L57.5 79.5M61 106L65 107M72.5 62.5L73.5 66.5M49 89L53 89M75.5 110.5L74.5 114.5M102 90.5L105 92.5M52.5 102.5L52.5 106.5M89 113.5L93 114.5M105 73L103 77"/>
  <!-- vermicelli -->
  <path class="sk-line" d="M69 88.5L74 95.5M75.5 99.5L68.5 105.5M101.5 81L93.5 86M62.5 65.5L54.5 68.5M67.5 115.5L59.5 117.5"/>
  <!-- feta -->
  <path class="sk-ink" d="M74.5 77h5v5h-5zM56.5 92.5h5v5h-5zM92 101h5v5h-5zM80 57h5v5h-5z"/>
  <!-- cranberries -->
  <g class="sk-accent-dot">
    <circle cx="64" cy="86" r="2.5"/><circle cx="82" cy="107.5" r="2.5"/><circle cx="94.5" cy="69.5" r="2.5"/><circle cx="47" cy="78.5" r="2.5"/>
    <circle cx="152" cy="106" r="2.5"/>
  </g>
  <!-- key -->
  <path class="sk-dash" d="M146 58H158"/>
  <path class="sk-ink" d="M150 75.5L154 72.5M149.5 119.5h5v5h-5z"/>
  <path class="sk-line" d="M147.5 92.5L156.5 87.5"/>
  <text x="164" y="61">no dolma</text>
  <text x="164" y="77">rice</text>
  <text x="164" y="93">vermicelli</text>
  <text x="164" y="109">cranberries</text>
  <text x="164" y="125">feta</text>
</svg>
