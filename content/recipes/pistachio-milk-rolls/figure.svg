<svg xmlns="http://www.w3.org/2000/svg" class="sketch" viewBox="0 0 240 180" role="img" aria-label="A softened sheet seen from its end, half rolled up, with ground pistachios scattered along it and caught between the turns of the roll.">
  <style>
    .sketch { fill: none; stroke-linecap: round; stroke-linejoin: round; color: var(--color-ink-2, #262c3a); font-family: var(--font-mono, "IBM Plex Mono", ui-monospace, Menlo, monospace); }
    .sketch text { fill: var(--color-ink-3, #6b7180); stroke: none; font-size: 9px; letter-spacing: 0.04em; }
    .sk-ink { stroke: currentColor; stroke-width: 1.25; }
    .sk-line { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; }
    .sk-dash { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; stroke-dasharray: 2 3; }
    .sk-accent { stroke: var(--color-accent, #b71c1c); stroke-width: 1.25; }
    .sk-dot { fill: currentColor; stroke: none; }
    .sk-accent-dot { fill: var(--color-accent, #b71c1c); stroke: none; }
    .sk-hole { fill: var(--color-paper, #fbfaf7); stroke: currentColor; stroke-width: 1.25; }
    @media (prefers-color-scheme: dark) {
      .sketch { color: var(--color-ink-2, #d9dce3); }
      .sketch text { fill: var(--color-ink-3, #9aa0ad); }
      .sk-line, .sk-dash { stroke: var(--color-ink-3, #9aa0ad); }
      .sk-accent { stroke: var(--color-accent, #ef6a5e); }
      .sk-accent-dot { fill: var(--color-accent, #ef6a5e); }
      .sk-hole { fill: var(--color-paper, #14161b); }
    }
  </style>
  <!-- the sheet, seen from its end: flat on the right, rolled up on the left -->
  <path class="sk-ink" d="M198 113H58A32 32 0 0 1 58 49A26 26 0 0 1 58 101A20 20 0 0 1 58 61A14 14 0 0 1 58 89A8 8 0 0 1 58 73"/>
  <!-- ground pistachios: along the flat of the sheet, and between the turns -->
  <g class="sk-accent-dot">
    <circle cx="62" cy="109" r="1.5"/><circle cx="70" cy="109" r="1.5"/><circle cx="78" cy="109" r="1.5"/><circle cx="86" cy="109" r="1.5"/><circle cx="94" cy="109" r="1.5"/><circle cx="102" cy="109" r="1.5"/><circle cx="110" cy="109" r="1.5"/><circle cx="118" cy="109" r="1.5"/><circle cx="126" cy="109" r="1.5"/><circle cx="134" cy="109" r="1.5"/><circle cx="142" cy="109" r="1.5"/><circle cx="150" cy="109" r="1.5"/><circle cx="158" cy="109" r="1.5"/><circle cx="166" cy="109" r="1.5"/><circle cx="174" cy="109" r="1.5"/><circle cx="182" cy="109" r="1.5"/><circle cx="190" cy="109" r="1.5"/>
    <circle cx="54" cy="108.5" r="1.5"/><circle cx="46.5" cy="106.5" r="1.5"/><circle cx="39.5" cy="102" r="1.5"/><circle cx="34.5" cy="96" r="1.5"/><circle cx="31" cy="89" r="1.5"/><circle cx="30" cy="81" r="1.5"/><circle cx="31" cy="73" r="1.5"/><circle cx="34.5" cy="66" r="1.5"/><circle cx="39.5" cy="60" r="1.5"/><circle cx="46.5" cy="55.5" r="1.5"/><circle cx="54" cy="53.5" r="1.5"/><circle cx="62" cy="53.5" r="1.5"/><circle cx="69.5" cy="56" r="1.5"/><circle cx="75.5" cy="61.5" r="1.5"/><circle cx="79" cy="68.5" r="1.5"/><circle cx="80" cy="76.5" r="1.5"/><circle cx="78" cy="84" r="1.5"/><circle cx="73.5" cy="90.5" r="1.5"/><circle cx="67" cy="95" r="1.5"/><circle cx="59" cy="97" r="1.5"/><circle cx="51.5" cy="95.5" r="1.5"/><circle cx="45" cy="90.5" r="1.5"/><circle cx="42" cy="83" r="1.5"/><circle cx="43" cy="75.5" r="1.5"/><circle cx="47.5" cy="69" r="1.5"/><circle cx="54.5" cy="65.5" r="1.5"/><circle cx="62.5" cy="66" r="1.5"/><circle cx="67.5" cy="72" r="1.5"/><circle cx="67" cy="79.5" r="1.5"/><circle cx="60.5" cy="84.5" r="1.5"/>
  </g>
  <!-- the way it rolls -->
  <path class="sk-line" d="M44.5 43.5A40 40 0 0 1 88.5 55.5M84 54L88.5 55.5L87.5 50.5"/>
  <!-- leaders -->
  <path class="sk-line" d="M150 104V87M162 117V129"/>
  <text x="96" y="46">rolled</text>
  <text x="118" y="81">ground pistachios</text>
  <text x="162" y="140" text-anchor="middle">softened sheet</text>
</svg>
