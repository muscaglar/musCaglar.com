<svg xmlns="http://www.w3.org/2000/svg" class="sketch" viewBox="0 0 240 180" role="img" aria-label="One potato köfte drawn across a centre line: its left half lies in a frying pan, its right half on the bars of a grill.">
  <style>
    .sketch { fill: none; stroke-linecap: round; stroke-linejoin: round; color: var(--color-ink-2, #262c3a); font-family: var(--font-mono, "IBM Plex Mono", ui-monospace, Menlo, monospace); }
    .sketch text { fill: var(--color-ink-3, #6b7180); stroke: none; font-size: 9px; letter-spacing: 0.04em; }
    .sk-ink { stroke: currentColor; stroke-width: 1.25; }
    .sk-line { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; }
    .sk-dash { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; stroke-dasharray: 2 3; }
    .sk-accent { stroke: var(--color-accent, #b71c1c); stroke-width: 1.25; }
    .sk-dot { fill: currentColor; stroke: none; }
    .sk-accent-dot { fill: var(--color-accent, #b71c1c); stroke: none; }
    .sk-hole { fill: var(--color-paper, #fbfaf7); stroke: currentColor; stroke-width: 1.25; }
    @media (prefers-color-scheme: dark) {
      .sketch { color: var(--color-ink-2, #d9dce3); }
      .sketch text { fill: var(--color-ink-3, #9aa0ad); }
      .sk-line, .sk-dash { stroke: var(--color-ink-3, #9aa0ad); }
      .sk-accent { stroke: var(--color-accent, #ef6a5e); }
      .sk-accent-dot { fill: var(--color-accent, #ef6a5e); }
      .sk-hole { fill: var(--color-paper, #14161b); }
    }
  </style>
  <!-- left of the centre line: half a frying pan in section, with its handle -->
  <path class="sk-ink" d="M12 74L50 80L58 103.5H116"/>
  <!-- the level of the oil -->
  <path class="sk-dash" d="M58.5 94H82"/>
  <!-- right of the centre line: the grill, its bars cut across -->
  <path class="sk-ink" d="M124 106.5H226"/>
  <circle class="sk-hole" cx="128" cy="106.5" r="3"/>
  <circle class="sk-hole" cx="138" cy="106.5" r="3"/>
  <circle class="sk-hole" cx="148" cy="106.5" r="3"/>
  <circle class="sk-hole" cx="158" cy="106.5" r="3"/>
  <circle class="sk-hole" cx="168" cy="106.5" r="3"/>
  <circle class="sk-hole" cx="178" cy="106.5" r="3"/>
  <circle class="sk-hole" cx="188" cy="106.5" r="3"/>
  <!-- the centre line -->
  <path class="sk-dash" d="M120 56V122"/>
  <!-- the köfte -->
  <ellipse class="sk-accent" cx="120" cy="85.5" rx="40" ry="15"/>
  <!-- leader -->
  <path class="sk-line" d="M147 72.5L155 58"/>
  <text x="159" y="56">potato köfte</text>
  <text x="86" y="134" text-anchor="middle">fried</text>
  <text x="154" y="134" text-anchor="middle">grilled</text>
</svg>
