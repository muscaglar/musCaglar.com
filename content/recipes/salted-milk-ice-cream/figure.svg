<svg xmlns="http://www.w3.org/2000/svg" class="sketch" viewBox="0 0 240 180" role="img" aria-label="A scoop of milk ice cream on a plate, cut in half, with grains of salt spread evenly all through it.">
  <style>
    .sketch { fill: none; stroke-linecap: round; stroke-linejoin: round; color: var(--color-ink-2, #262c3a); font-family: var(--font-mono, "IBM Plex Mono", ui-monospace, Menlo, monospace); }
    .sketch text { fill: var(--color-ink-3, #6b7180); stroke: none; font-size: 9px; letter-spacing: 0.04em; }
    .sk-ink { stroke: currentColor; stroke-width: 1.25; }
    .sk-line { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; }
    .sk-dash { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; stroke-dasharray: 2 3; }
    .sk-accent { stroke: var(--color-accent, #b71c1c); stroke-width: 1.25; }
    .sk-dot { fill: currentColor; stroke: none; }
    .sk-accent-dot { fill: var(--color-accent, #b71c1c); stroke: none; }
    .sk-hole { fill: var(--color-paper, #fbfaf7); stroke: currentColor; stroke-width: 1.25; }
    @media (prefers-color-scheme: dark) {
      .sketch { color: var(--color-ink-2, #d9dce3); }
      .sketch text { fill: var(--color-ink-3, #9aa0ad); }
      .sk-line, .sk-dash { stroke: var(--color-ink-3, #9aa0ad); }
      .sk-accent { stroke: var(--color-accent, #ef6a5e); }
      .sk-accent-dot { fill: var(--color-accent, #ef6a5e); }
      .sk-hole { fill: var(--color-paper, #14161b); }
    }
  </style>
  <!-- the scoop, cut in half: the dome and its collar -->
  <path class="sk-ink" d="M78 104A40 40 0 1 1 142 104Q153 108 152 116Q151.5 121 146 121M78 104Q67 108 68 116Q68.5 121 74 121"/>
  <path class="sk-line" d="M78 104q8 5 16 0t16 0t16 0t16 0"/>
  <!-- the plate it sits on -->
  <path class="sk-ink" d="M52 116Q54 121 60 121H160Q166 121 168 116"/>
  <!-- the salt, all through it -->
  <g>
    <circle class="sk-accent-dot" cx="89" cy="56" r="1.5"/>
    <circle class="sk-accent-dot" cx="103" cy="56" r="1.5"/>
    <circle class="sk-accent-dot" cx="117" cy="56" r="1.5"/>
    <circle class="sk-accent-dot" cx="131" cy="56" r="1.5"/>
    <circle class="sk-accent-dot" cx="82" cy="68" r="1.5"/>
    <circle class="sk-accent-dot" cx="96" cy="68" r="1.5"/>
    <circle class="sk-accent-dot" cx="110" cy="68" r="1.5"/>
    <circle class="sk-accent-dot" cx="124" cy="68" r="1.5"/>
    <circle class="sk-accent-dot" cx="138" cy="68" r="1.5"/>
    <circle class="sk-accent-dot" cx="89" cy="80" r="1.5"/>
    <circle class="sk-accent-dot" cx="103" cy="80" r="1.5"/>
    <circle class="sk-accent-dot" cx="117" cy="80" r="1.5"/>
    <circle class="sk-accent-dot" cx="131" cy="80" r="1.5"/>
    <circle class="sk-accent-dot" cx="82" cy="92" r="1.5"/>
    <circle class="sk-accent-dot" cx="96" cy="92" r="1.5"/>
    <circle class="sk-accent-dot" cx="110" cy="92" r="1.5"/>
    <circle class="sk-accent-dot" cx="124" cy="92" r="1.5"/>
    <circle class="sk-accent-dot" cx="138" cy="92" r="1.5"/>
  </g>
  <!-- leader -->
  <path class="sk-line" d="M144 68H172"/>
  <text x="176" y="71">salt</text>
  <text x="110" y="142" text-anchor="middle">milk ice cream</text>
</svg>
