<svg xmlns="http://www.w3.org/2000/svg" class="sketch" viewBox="0 0 240 180" role="img" aria-label="A dish of oven pasta cut in half, in four bands whose order is not yet settled: pure pasta, pasta mixed with mince, a layer of mince, and béchamel.">
  <style>
    .sketch { fill: none; stroke-linecap: round; stroke-linejoin: round; color: var(--color-ink-2, #262c3a); font-family: var(--font-mono, "IBM Plex Mono", ui-monospace, Menlo, monospace); }
    .sketch text { fill: var(--color-ink-3, #6b7180); stroke: none; font-size: 9px; letter-spacing: 0.04em; }
    .sk-ink { stroke: currentColor; stroke-width: 1.25; }
    .sk-line { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; }
    .sk-dash { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; stroke-dasharray: 2 3; }
    .sk-accent { stroke: var(--color-accent, #b71c1c); stroke-width: 1.25; }
    .sk-dot { fill: currentColor; stroke: none; }
    .sk-accent-dot { fill: var(--color-accent, #b71c1c); stroke: none; }
    .sk-hole { fill: var(--color-paper, #fbfaf7); stroke: currentColor; stroke-width: 1.25; }
    @media (prefers-color-scheme: dark) {
      .sketch { color: var(--color-ink-2, #d9dce3); }
      .sketch text { fill: var(--color-ink-3, #9aa0ad); }
      .sk-line, .sk-dash { stroke: var(--color-ink-3, #9aa0ad); }
      .sk-accent { stroke: var(--color-accent, #ef6a5e); }
      .sk-accent-dot { fill: var(--color-accent, #ef6a5e); }
      .sk-hole { fill: var(--color-paper, #14161b); }
    }
  </style>
  <!-- the dish, cut in half -->
  <path class="sk-ink" d="M12 46H18V134H122V46H128"/>
  <!-- the top of the béchamel -->
  <path class="sk-ink" d="M18 54H122"/>
  <!-- the mince layer -->
  <g>
    <path class="sk-accent" d="M18 74H122M18 94H122"/>
    <g class="sk-accent-dot">
      <circle cx="25" cy="81" r="1.5"/><circle cx="35" cy="81" r="1.5"/><circle cx="45" cy="81" r="1.5"/><circle cx="55" cy="81" r="1.5"/><circle cx="65" cy="81" r="1.5"/><circle cx="75" cy="81" r="1.5"/><circle cx="85" cy="81" r="1.5"/><circle cx="95" cy="81" r="1.5"/><circle cx="105" cy="81" r="1.5"/><circle cx="115" cy="81" r="1.5"/>
      <circle cx="30" cy="87" r="1.5"/><circle cx="40" cy="87" r="1.5"/><circle cx="50" cy="87" r="1.5"/><circle cx="60" cy="87" r="1.5"/><circle cx="70" cy="87" r="1.5"/><circle cx="80" cy="87" r="1.5"/><circle cx="90" cy="87" r="1.5"/><circle cx="100" cy="87" r="1.5"/><circle cx="110" cy="87" r="1.5"/>
    </g>
  </g>
  <!-- one half of the pasta: pasta mixed with mince -->
  <g class="sk-ink">
    <circle cx="28" cy="104" r="4.5"/><circle cx="56" cy="104" r="4.5"/><circle cx="84" cy="104" r="4.5"/><circle cx="112" cy="104" r="4.5"/>
  </g>
  <g class="sk-dot">
    <circle cx="42" cy="99" r="1.5"/><circle cx="42" cy="109" r="1.5"/><circle cx="70" cy="99" r="1.5"/><circle cx="70" cy="109" r="1.5"/><circle cx="98" cy="99" r="1.5"/><circle cx="98" cy="109" r="1.5"/>
  </g>
  <!-- where the two halves of the pasta meet -->
  <path class="sk-dash" d="M21 114H120"/>
  <!-- the other half: pure pasta -->
  <g class="sk-ink">
    <circle cx="24.5" cy="124" r="4.5"/><circle cx="37.5" cy="124" r="4.5"/><circle cx="50.5" cy="124" r="4.5"/><circle cx="63.5" cy="124" r="4.5"/><circle cx="76.5" cy="124" r="4.5"/><circle cx="89.5" cy="124" r="4.5"/><circle cx="102.5" cy="124" r="4.5"/><circle cx="115.5" cy="124" r="4.5"/>
  </g>
  <!-- leaders, clear of the wall -->
  <path class="sk-line" d="M124 64H134M124 84H134M124 104H134M124 124H134"/>
  <text x="138" y="67">béchamel</text>
  <text x="138" y="87">mince layer</text>
  <text x="138" y="107">pasta with mince</text>
  <text x="138" y="127">pure pasta</text>
</svg>
