<svg xmlns="http://www.w3.org/2000/svg" class="sketch" viewBox="0 0 240 180" role="img" aria-label="Four bowls join into one, in order: the sabayon goes into the mascarpone first, then the egg whites, then the whipped cream.">
  <style>
    .sketch { fill: none; stroke-linecap: round; stroke-linejoin: round; color: var(--color-ink-2, #262c3a); font-family: var(--font-mono, "IBM Plex Mono", ui-monospace, Menlo, monospace); }
    .sketch text { fill: var(--color-ink-3, #6b7180); stroke: none; font-size: 9px; letter-spacing: 0.04em; }
    .sk-ink { stroke: currentColor; stroke-width: 1.25; }
    .sk-line { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; }
    .sk-dash { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; stroke-dasharray: 2 3; }
    .sk-accent { stroke: var(--color-accent, #b71c1c); stroke-width: 1.25; }
    .sk-dot { fill: currentColor; stroke: none; }
    .sk-accent-dot { fill: var(--color-accent, #b71c1c); stroke: none; }
    .sk-hole { fill: var(--color-paper, #fbfaf7); stroke: currentColor; stroke-width: 1.25; }
    @media (prefers-color-scheme: dark) {
      .sketch { color: var(--color-ink-2, #d9dce3); }
      .sketch text { fill: var(--color-ink-3, #9aa0ad); }
      .sk-line, .sk-dash { stroke: var(--color-ink-3, #9aa0ad); }
      .sk-accent { stroke: var(--color-accent, #ef6a5e); }
      .sk-accent-dot { fill: var(--color-accent, #ef6a5e); }
      .sk-hole { fill: var(--color-paper, #14161b); }
    }
  </style>
  <!-- mascarpone: the bowl, what is in it, and the trunk that runs down to the last bowl -->
  <path class="sk-ink" d="M90 16A16 14 0 0 0 122 16M126 16H188Q196 16 196 24V142M192.5 138.5L196 142.5L199.5 138.5"/>
  <path class="sk-line" d="M91.5 20H120.5"/>
  <!-- sabayon: goes into the mascarpone first -->
  <g>
    <path class="sk-accent" d="M90 48A16 14 0 0 0 122 48M126 48H188Q196 48 196 56M91.5 52H120.5"/>
    <circle class="sk-accent-dot" cx="196" cy="56" r="2"/>
  </g>
  <!-- egg whites -->
  <path class="sk-ink" d="M90 80A16 14 0 0 0 122 80M126 80H188Q196 80 196 88"/>
  <path class="sk-line" d="M91.5 84H120.5"/>
  <circle class="sk-dot" cx="196" cy="88" r="2"/>
  <!-- whipped cream -->
  <path class="sk-ink" d="M90 112A16 14 0 0 0 122 112M126 112H188Q196 112 196 120"/>
  <path class="sk-line" d="M91.5 116H120.5"/>
  <circle class="sk-dot" cx="196" cy="120" r="2"/>
  <!-- the one bowl they end in -->
  <path class="sk-ink" d="M168 148A28 20 0 0 0 224 148"/>
  <path class="sk-line" d="M170 154H222"/>
  <text x="84" y="26" text-anchor="end">mascarpone</text>
  <text x="84" y="58" text-anchor="end">sabayon</text>
  <text x="84" y="90" text-anchor="end">egg whites</text>
  <text x="84" y="122" text-anchor="end">whipped cream</text>
  <text x="160" y="164" text-anchor="end">the cream</text>
</svg>
