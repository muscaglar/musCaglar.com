<svg xmlns="http://www.w3.org/2000/svg" class="sketch" viewBox="0 0 240 180" role="img" aria-label="A lahmacun cut through and seen edge on, with a part of it enlarged in a circle above: the dough with the topping on it.">
  <style>
    .sketch { fill: none; stroke-linecap: round; stroke-linejoin: round; color: var(--color-ink-2, #262c3a); font-family: var(--font-mono, "IBM Plex Mono", ui-monospace, Menlo, monospace); }
    .sketch text { fill: var(--color-ink-3, #6b7180); stroke: none; font-size: 9px; letter-spacing: 0.04em; }
    .sk-ink { stroke: currentColor; stroke-width: 1.25; }
    .sk-line { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; }
    .sk-dash { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; stroke-dasharray: 2 3; }
    .sk-accent { stroke: var(--color-accent, #b71c1c); stroke-width: 1.25; }
    .sk-dot { fill: currentColor; stroke: none; }
    .sk-accent-dot { fill: var(--color-accent, #b71c1c); stroke: none; }
    .sk-hole { fill: var(--color-paper, #fbfaf7); stroke: currentColor; stroke-width: 1.25; }
    @media (prefers-color-scheme: dark) {
      .sketch { color: var(--color-ink-2, #d9dce3); }
      .sketch text { fill: var(--color-ink-3, #9aa0ad); }
      .sk-line, .sk-dash { stroke: var(--color-ink-3, #9aa0ad); }
      .sk-accent { stroke: var(--color-accent, #ef6a5e); }
      .sk-accent-dot { fill: var(--color-accent, #ef6a5e); }
      .sk-hole { fill: var(--color-paper, #14161b); }
    }
  </style>
  <!-- the lahmacun, cut through: the dough -->
  <path class="sk-ink" d="M27 128H213A3 3 0 0 1 213 134H27A3 3 0 0 1 27 128Z"/>
  <!-- the part that is enlarged, and the enlargement -->
  <circle class="sk-line" cx="120" cy="129.5" r="9"/>
  <path class="sk-line" d="M120 120.5V106"/>
  <circle class="sk-line" cx="120" cy="64" r="42"/>
  <!-- enlarged: the dough -->
  <path class="sk-ink" d="M79 56H161M83 84H157"/>
  <!-- the topping, on the lahmacun and enlarged -->
  <g class="sk-accent">
    <path d="M32 124.5H208M82 46H158"/>
    <circle class="sk-accent-dot" cx="88" cy="51" r="1.5"/>
    <circle class="sk-accent-dot" cx="96" cy="51" r="1.5"/>
    <circle class="sk-accent-dot" cx="104" cy="51" r="1.5"/>
    <circle class="sk-accent-dot" cx="112" cy="51" r="1.5"/>
    <circle class="sk-accent-dot" cx="120" cy="51" r="1.5"/>
    <circle class="sk-accent-dot" cx="128" cy="51" r="1.5"/>
    <circle class="sk-accent-dot" cx="136" cy="51" r="1.5"/>
    <circle class="sk-accent-dot" cx="144" cy="51" r="1.5"/>
    <circle class="sk-accent-dot" cx="152" cy="51" r="1.5"/>
  </g>
  <!-- leaders -->
  <path class="sk-line" d="M150 46L170 36M150 70L172 82"/>
  <circle class="sk-dot" cx="150" cy="70" r="1.5"/>
  <text x="174" y="37">topping</text>
  <text x="176" y="86">dough</text>
  <text x="120" y="154" text-anchor="middle">in section</text>
</svg>
