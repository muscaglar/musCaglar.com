<svg xmlns="http://www.w3.org/2000/svg" class="sketch" viewBox="0 0 240 180" role="img" aria-label="A graph of the temperature of the exhaust air against time. It rises quickly, flattens at 244 degrees, steps down to 235 at first crack and ends when the roast is cooled.">
<style>
    .sketch { fill: none; stroke-linecap: round; stroke-linejoin: round; color: var(--color-ink-2, #262c3a); font-family: var(--font-mono, "IBM Plex Mono", ui-monospace, Menlo, monospace); }
    .sketch text { fill: var(--color-ink-3, #6b7180); stroke: none; font-size: 9px; letter-spacing: 0.04em; }
    .sk-ink { stroke: currentColor; stroke-width: 1.25; }
    .sk-line { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; }
    .sk-dash { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; stroke-dasharray: 2 3; }
    .sk-accent { stroke: var(--color-accent, #b71c1c); stroke-width: 1.25; }
    .sk-dot { fill: currentColor; stroke: none; }
    .sk-accent-dot { fill: var(--color-accent, #b71c1c); stroke: none; }
    .sk-hole { fill: var(--color-paper, #fbfaf7); stroke: currentColor; stroke-width: 1.25; }
    @media (prefers-color-scheme: dark) {
      .sketch { color: var(--color-ink-2, #d9dce3); }
      .sketch text { fill: var(--color-ink-3, #9aa0ad); }
      .sk-line, .sk-dash { stroke: var(--color-ink-3, #9aa0ad); }
      .sk-accent { stroke: var(--color-accent, #ef6a5e); }
      .sk-accent-dot { fill: var(--color-accent, #ef6a5e); }
      .sk-hole { fill: var(--color-paper, #14161b); }
    }
  </style>
  <!-- the axes: time across, exhaust air up -->
  <path class="sk-ink" d="M34 24V146H224"/>
  <!-- marks at 5 and 10 minutes, and at 100 and 200 degrees -->
  <path class="sk-line" d="M111.5 146v4M189 146v4M34 100.6h-4M34 55.2h-4"/>
  <!-- first crack, and the cool -->
  <path class="sk-dash" d="M177.4 35.3V146M198 39.3V146"/>
  <!-- after the cool the air falls away: not part of the design, and not to scale -->
  <path class="sk-dash" d="M198 39.3q6 6 9 30"/>
  <!-- the design: held at 244, cut to 235 at first crack -->
  <path class="sk-accent" d="M34 125.6C36.6 119.4 44.3 97.7 49.5 88.4C54.7 79.1 59 75.3 65 69.8C71 64.2 77.9 59.9 85.7 55.2C93.4 50.5 102.5 44.9 111.5 41.6C120.5 38.3 135.2 36.3 139.9 35.3H177.4L179.9 39.3H198"/>
  <text x="40" y="28">exhaust air</text>
  <text x="158.6" y="28.3" text-anchor="middle">244 °C</text>
  <text x="173" y="104" text-anchor="end">first crack</text>
  <text x="203" y="104">cool</text>
  <text x="111.5" y="162" text-anchor="middle">5 min</text>
</svg>
