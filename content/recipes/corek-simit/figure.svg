<svg xmlns="http://www.w3.org/2000/svg" class="sketch" viewBox="0 0 240 180" role="img" aria-label="A ring of simit seen from above, with a second ring inside it in five parts, one for each spice of the mix.">
  <style>
    .sketch { fill: none; stroke-linecap: round; stroke-linejoin: round; color: var(--color-ink-2, #262c3a); font-family: var(--font-mono, "IBM Plex Mono", ui-monospace, Menlo, monospace); }
    .sketch text { fill: var(--color-ink-3, #6b7180); stroke: none; font-size: 9px; letter-spacing: 0.04em; }
    .sk-ink { stroke: currentColor; stroke-width: 1.25; }
    .sk-line { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; }
    .sk-dash { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; stroke-dasharray: 2 3; }
    .sk-accent { stroke: var(--color-accent, #b71c1c); stroke-width: 1.25; }
    .sk-dot { fill: currentColor; stroke: none; }
    .sk-accent-dot { fill: var(--color-accent, #b71c1c); stroke: none; }
    .sk-hole { fill: var(--color-paper, #fbfaf7); stroke: currentColor; stroke-width: 1.25; }
    @media (prefers-color-scheme: dark) {
      .sketch { color: var(--color-ink-2, #d9dce3); }
      .sketch text { fill: var(--color-ink-3, #9aa0ad); }
      .sk-line, .sk-dash { stroke: var(--color-ink-3, #9aa0ad); }
      .sk-accent { stroke: var(--color-accent, #ef6a5e); }
      .sk-accent-dot { fill: var(--color-accent, #ef6a5e); }
      .sk-hole { fill: var(--color-paper, #14161b); }
    }
  </style>
  <!-- the simit, from above -->
  <circle class="sk-ink" cx="120" cy="93" r="52"/>
  <circle class="sk-ink" cx="120" cy="93" r="27"/>
  <!-- the spice mix: five parts of one ring -->
  <g class="sk-accent">
    <path d="M101 58.5A39.5 39.5 0 0 1 139 58.5"/>
    <path d="M147 64A39.5 39.5 0 0 1 159 100.5"/>
    <path d="M156 109.5A39.5 39.5 0 0 1 125 132"/>
    <path d="M115 132A39.5 39.5 0 0 1 84 109.5"/>
    <path d="M81 100.5A39.5 39.5 0 0 1 93 64"/>
  </g>
  <!-- leaders -->
  <path class="sk-line" d="M120 50L120 32M161 79.5L178 74M145.5 128L156 142.5M94.5 128L84 142.5M79 79.5L62 74"/>
  <text x="120" y="25" text-anchor="middle">mahlep</text>
  <text x="182" y="76.5">cinnamon</text>
  <text x="160" y="151">aniseed</text>
  <text x="80" y="151" text-anchor="end">mastic</text>
  <text x="58" y="76.5" text-anchor="end">clove</text>
</svg>
