<svg xmlns="http://www.w3.org/2000/svg" class="sketch" viewBox="0 0 240 180" role="img" aria-label="A slice of brioche toast in section with what goes on it drawn apart, from the bottom up: miso brown butter, honey, a scoop of oregano ice cream and a drizzle of olive oil.">
  <style>
    .sketch { fill: none; stroke-linecap: round; stroke-linejoin: round; color: var(--color-ink-2, #262c3a); font-family: var(--font-mono, "IBM Plex Mono", ui-monospace, Menlo, monospace); }
    .sketch text { fill: var(--color-ink-3, #6b7180); stroke: none; font-size: 9px; letter-spacing: 0.04em; }
    .sk-ink { stroke: currentColor; stroke-width: 1.25; }
    .sk-line { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; }
    .sk-dash { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; stroke-dasharray: 2 3; }
    .sk-accent { stroke: var(--color-accent, #b71c1c); stroke-width: 1.25; }
    .sk-dot { fill: currentColor; stroke: none; }
    .sk-accent-dot { fill: var(--color-accent, #b71c1c); stroke: none; }
    .sk-hole { fill: var(--color-paper, #fbfaf7); stroke: currentColor; stroke-width: 1.25; }
    @media (prefers-color-scheme: dark) {
      .sketch { color: var(--color-ink-2, #d9dce3); }
      .sketch text { fill: var(--color-ink-3, #9aa0ad); }
      .sk-line, .sk-dash { stroke: var(--color-ink-3, #9aa0ad); }
      .sk-accent { stroke: var(--color-accent, #ef6a5e); }
      .sk-accent-dot { fill: var(--color-accent, #ef6a5e); }
      .sk-hole { fill: var(--color-paper, #14161b); }
    }
  </style>
  <!-- the brioche toast, in section, with its crumb -->
  <path class="sk-ink" d="M18 130H106Q112 130 112 136V150Q112 156 106 156H18Q12 156 12 150V136Q12 130 18 130Z"/>
  <circle class="sk-line" cx="30" cy="141" r="2"/>
  <circle class="sk-line" cx="50" cy="147" r="1.5"/>
  <circle class="sk-line" cx="68" cy="140" r="2.5"/>
  <circle class="sk-line" cx="86" cy="147" r="1.5"/>
  <circle class="sk-line" cx="98" cy="140" r="2"/>
  <!-- miso brown butter -->
  <path class="sk-accent" d="M14 120Q14 116 18 116H106Q110 116 110 120"/>
  <!-- honey -->
  <path class="sk-ink" d="M20 104Q20 100 24 100H100Q104 100 104 104"/>
  <!-- the oregano ice cream: the dome and its collar -->
  <path class="sk-ink" d="M42 81A25 25 0 1 1 82 81Q89 84 88 89Q87.5 92 84 92H40Q36.5 92 36 89Q35 84 42 81"/>
  <path class="sk-line" d="M42 81q5 3.5 10 0t10 0t10 0t10 0"/>
  <!-- the olive oil -->
  <path class="sk-ink" d="M34 28q7-10 14 0t14 0t14 0t14 0"/>
  <!-- leaders -->
  <path class="sk-line" d="M96 28H126M92 66H126M108 101H126M114 117H126M116 143H126"/>
  <text x="131" y="31">olive oil</text>
  <text x="131" y="69">oregano ice cream</text>
  <text x="131" y="104">honey</text>
  <text x="131" y="120">miso brown butter</text>
  <text x="131" y="146">brioche toast</text>
</svg>
