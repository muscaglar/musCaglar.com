<svg xmlns="http://www.w3.org/2000/svg" class="sketch" viewBox="0 0 240 180" role="img" aria-label="A slice of biscuit cake seen from the side: four layers of biscuits with three layers of custard between them.">
  <style>
    .sketch { fill: none; stroke-linecap: round; stroke-linejoin: round; color: var(--color-ink-2, #262c3a); font-family: var(--font-mono, "IBM Plex Mono", ui-monospace, Menlo, monospace); }
    .sketch text { fill: var(--color-ink-3, #6b7180); stroke: none; font-size: 9px; letter-spacing: 0.04em; }
    .sk-ink { stroke: currentColor; stroke-width: 1.25; }
    .sk-line { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; }
    .sk-dash { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; stroke-dasharray: 2 3; }
    .sk-accent { stroke: var(--color-accent, #b71c1c); stroke-width: 1.25; }
    .sk-dot { fill: currentColor; stroke: none; }
    .sk-accent-dot { fill: var(--color-accent, #b71c1c); stroke: none; }
    .sk-hole { fill: var(--color-paper, #fbfaf7); stroke: currentColor; stroke-width: 1.25; }
    @media (prefers-color-scheme: dark) {
      .sketch { color: var(--color-ink-2, #d9dce3); }
      .sketch text { fill: var(--color-ink-3, #9aa0ad); }
      .sk-line, .sk-dash { stroke: var(--color-ink-3, #9aa0ad); }
      .sk-accent { stroke: var(--color-accent, #ef6a5e); }
      .sk-accent-dot { fill: var(--color-accent, #ef6a5e); }
      .sk-hole { fill: var(--color-paper, #14161b); }
    }
  </style>
  <!-- the biscuits, four layers of three, seen edge on -->
  <g class="sk-ink">
    <rect x="27" y="32" width="36" height="8" rx="2"/><rect x="66" y="32" width="36" height="8" rx="2"/><rect x="105" y="32" width="36" height="8" rx="2"/>
    <rect x="27" y="57" width="36" height="8" rx="2"/><rect x="66" y="57" width="36" height="8" rx="2"/><rect x="105" y="57" width="36" height="8" rx="2"/>
    <rect x="27" y="82" width="36" height="8" rx="2"/><rect x="66" y="82" width="36" height="8" rx="2"/><rect x="105" y="82" width="36" height="8" rx="2"/>
    <rect x="27" y="107" width="36" height="8" rx="2"/><rect x="66" y="107" width="36" height="8" rx="2"/><rect x="105" y="107" width="36" height="8" rx="2"/>
  </g>
  <!-- the custard between them -->
  <g class="sk-accent">
    <rect x="24" y="42.5" width="120" height="12" rx="6"/>
    <rect x="24" y="67.5" width="120" height="12" rx="6"/>
    <rect x="24" y="92.5" width="120" height="12" rx="6"/>
  </g>
  <!-- the plate -->
  <path class="sk-line" d="M14 120H154"/>
  <!-- leaders -->
  <path class="sk-line" d="M141 36H156M144 73.5H156"/>
  <text x="160" y="39">biscuits</text>
  <text x="160" y="76.5">hot custard</text>
  <text x="84" y="142" text-anchor="middle">served cold</text>
</svg>
