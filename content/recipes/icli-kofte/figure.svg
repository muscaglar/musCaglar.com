<svg xmlns="http://www.w3.org/2000/svg" class="sketch" viewBox="0 0 240 180" role="img" aria-label="An içli köfte seen from the side with a quarter cut away, showing the shell and the filling inside it.">
  <style>
    .sketch { fill: none; stroke-linecap: round; stroke-linejoin: round; color: var(--color-ink-2, #262c3a); font-family: var(--font-mono, "IBM Plex Mono", ui-monospace, Menlo, monospace); }
    .sketch text { fill: var(--color-ink-3, #6b7180); stroke: none; font-size: 9px; letter-spacing: 0.04em; }
    .sk-ink { stroke: currentColor; stroke-width: 1.25; }
    .sk-line { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; }
    .sk-dash { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; stroke-dasharray: 2 3; }
    .sk-accent { stroke: var(--color-accent, #b71c1c); stroke-width: 1.25; }
    .sk-dot { fill: currentColor; stroke: none; }
    .sk-accent-dot { fill: var(--color-accent, #b71c1c); stroke: none; }
    .sk-hole { fill: var(--color-paper, #fbfaf7); stroke: currentColor; stroke-width: 1.25; }
    @media (prefers-color-scheme: dark) {
      .sketch { color: var(--color-ink-2, #d9dce3); }
      .sketch text { fill: var(--color-ink-3, #9aa0ad); }
      .sk-line, .sk-dash { stroke: var(--color-ink-3, #9aa0ad); }
      .sk-accent { stroke: var(--color-accent, #ef6a5e); }
      .sk-accent-dot { fill: var(--color-accent, #ef6a5e); }
      .sk-hole { fill: var(--color-paper, #14161b); }
    }
  </style>
  <!-- the outside -->
  <path class="sk-ink" d="M24 88C64 32 176 32 216 88C176 144 64 144 24 88Z"/>
  <!-- the two faces of the cut -->
  <path class="sk-ink" d="M120 46V88H216"/>
  <!-- the shell, where it is cut -->
  <path class="sk-line" d="M122.5 54.5L130 47M134 55L140.5 48.5M145 56L151 50M155 58L160.5 52.5M164 61L169.5 55.5M173 64L178 59M181 68L186 63M189 72L193.5 67.5M196 77L200 73M202 83L206.5 78.5M210 87L212 85"/>
  <!-- the filling -->
  <g class="sk-accent">
    <path d="M120 55C153.5 55 187.5 66 205 88"/>
    <circle class="sk-accent-dot" cx="127" cy="81" r="1.5"/>
    <circle class="sk-accent-dot" cx="138" cy="81" r="1.5"/>
    <circle class="sk-accent-dot" cx="149" cy="81" r="1.5"/>
    <circle class="sk-accent-dot" cx="160" cy="81" r="1.5"/>
    <circle class="sk-accent-dot" cx="171" cy="81" r="1.5"/>
    <circle class="sk-accent-dot" cx="182" cy="81" r="1.5"/>
    <circle class="sk-accent-dot" cx="127" cy="73" r="1.5"/>
    <circle class="sk-accent-dot" cx="138" cy="73" r="1.5"/>
    <circle class="sk-accent-dot" cx="149" cy="73" r="1.5"/>
    <circle class="sk-accent-dot" cx="160" cy="73" r="1.5"/>
    <circle class="sk-accent-dot" cx="171" cy="73" r="1.5"/>
    <circle class="sk-accent-dot" cx="127" cy="65" r="1.5"/>
    <circle class="sk-accent-dot" cx="138" cy="65" r="1.5"/>
    <circle class="sk-accent-dot" cx="149" cy="65" r="1.5"/>
  </g>
  <!-- leaders -->
  <path class="sk-line" d="M143.5 69V34M172 59.5L189 40M64 121.5L53 140"/>
  <circle class="sk-dot" cx="143.5" cy="69" r="1.5"/>
  <circle class="sk-dot" cx="172" cy="59.5" r="1.5"/>
  <text x="143.5" y="28" text-anchor="middle">filling</text>
  <text x="193" y="39">shell</text>
  <text x="48" y="151" text-anchor="middle">outside</text>
</svg>
