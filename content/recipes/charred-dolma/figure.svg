<svg xmlns="http://www.w3.org/2000/svg" class="sketch" viewBox="0 0 240 180" role="img" aria-label="One roll of dolma lying on its side with the near end cut off. The outside is charred; the cut end shows the filling of rice, raisins and caramelised onion.">
  <style>
    .sketch { fill: none; stroke-linecap: round; stroke-linejoin: round; color: var(--color-ink-2, #262c3a); font-family: var(--font-mono, "IBM Plex Mono", ui-monospace, Menlo, monospace); }
    .sketch text { fill: var(--color-ink-3, #6b7180); stroke: none; font-size: 9px; letter-spacing: 0.04em; }
    .sk-ink { stroke: currentColor; stroke-width: 1.25; }
    .sk-line { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; }
    .sk-dash { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; stroke-dasharray: 2 3; }
    .sk-accent { stroke: var(--color-accent, #b71c1c); stroke-width: 1.25; }
    .sk-dot { fill: currentColor; stroke: none; }
    .sk-accent-dot { fill: var(--color-accent, #b71c1c); stroke: none; }
    .sk-hole { fill: var(--color-paper, #fbfaf7); stroke: currentColor; stroke-width: 1.25; }
    @media (prefers-color-scheme: dark) {
      .sketch { color: var(--color-ink-2, #d9dce3); }
      .sketch text { fill: var(--color-ink-3, #9aa0ad); }
      .sk-line, .sk-dash { stroke: var(--color-ink-3, #9aa0ad); }
      .sk-accent { stroke: var(--color-accent, #ef6a5e); }
      .sk-accent-dot { fill: var(--color-accent, #ef6a5e); }
      .sk-hole { fill: var(--color-paper, #14161b); }
    }
  </style>
  <!-- the charred outside: the length of the roll, its closed end, and the rim of the cut -->
  <path class="sk-accent" d="M132 54H52A28 36 0 0 0 52 126H132M132 54A28 36 0 0 1 132 126A28 36 0 0 1 132 54"/>
  <!-- the wrapping, seen at the cut -->
  <ellipse class="sk-ink" cx="132" cy="90" rx="22.5" ry="30.5"/>
  <!-- the filling: slivers of onion, grains of rice, raisins -->
  <path class="sk-ink" d="M125 102Q127 110 136 111M118 80Q124 88 118 96M131 84Q139 85.5 141 93"/>
  <path class="sk-line" d="M128 66L132.5 67.5M120.5 73L124.5 71M143 81L146 84.5M145 96.5L148.5 94.5M131 97L135.5 98.5M117 101L120 104.5M130 77L134.5 78.5"/>
  <circle class="sk-dot" cx="138" cy="74" r="2"/>
  <circle class="sk-dot" cx="127" cy="90" r="2"/>
  <circle class="sk-dot" cx="141" cy="103" r="2"/>
  <!-- leaders -->
  <path class="sk-line" d="M78 51.5V41M141 74H172M150.5 95.5H172M131 112.5V141"/>
  <text x="78" y="36" text-anchor="middle">charred outer</text>
  <text x="176" y="77">raisins</text>
  <text x="176" y="98.5">rice</text>
  <text x="131" y="152" text-anchor="middle">caramelised onion</text>
</svg>
