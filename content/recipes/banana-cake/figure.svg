<svg xmlns="http://www.w3.org/2000/svg" class="sketch" viewBox="0 0 240 180" role="img" aria-label="Two cake tins seen from above, one above the other, each with a swirl of tahini through the batter.">
  <style>
    .sketch { fill: none; stroke-linecap: round; stroke-linejoin: round; color: var(--color-ink-2, #262c3a); font-family: var(--font-mono, "IBM Plex Mono", ui-monospace, Menlo, monospace); }
    .sketch text { fill: var(--color-ink-3, #6b7180); stroke: none; font-size: 9px; letter-spacing: 0.04em; }
    .sk-ink { stroke: currentColor; stroke-width: 1.25; }
    .sk-line { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; }
    .sk-dash { stroke: var(--color-ink-3, #6b7180); stroke-width: 1; stroke-dasharray: 2 3; }
    .sk-accent { stroke: var(--color-accent, #b71c1c); stroke-width: 1.25; }
    .sk-dot { fill: currentColor; stroke: none; }
    .sk-accent-dot { fill: var(--color-accent, #b71c1c); stroke: none; }
    .sk-hole { fill: var(--color-paper, #fbfaf7); stroke: currentColor; stroke-width: 1.25; }
    @media (prefers-color-scheme: dark) {
      .sketch { color: var(--color-ink-2, #d9dce3); }
      .sketch text { fill: var(--color-ink-3, #9aa0ad); }
      .sk-line, .sk-dash { stroke: var(--color-ink-3, #9aa0ad); }
      .sk-accent { stroke: var(--color-accent, #ef6a5e); }
      .sk-accent-dot { fill: var(--color-accent, #ef6a5e); }
      .sk-hole { fill: var(--color-paper, #14161b); }
    }
  </style>
  <!-- the two tins, seen from above: rim and base -->
  <rect class="sk-ink" x="20" y="22" width="120" height="52" rx="5"/>
  <rect class="sk-line" x="26" y="28" width="108" height="40" rx="3"/>
  <rect class="sk-ink" x="20" y="90" width="120" height="52" rx="5"/>
  <rect class="sk-line" x="26" y="96" width="108" height="40" rx="3"/>
  <!-- the tahini, swirled in -->
  <path class="sk-accent" d="M30 58C44 58 50 38 42 38S36 58 50 58C64 58 70 38 62 38S56 58 70 58C84 58 90 38 82 38S76 58 90 58C104 58 110 38 102 38S96 58 110 58C124 58 130 38 122 38S116 58 130 58M30 126C44 126 50 106 42 106S36 126 50 126C64 126 70 106 62 106S56 126 70 126C84 126 90 106 82 106S76 126 90 126C104 126 110 106 102 106S96 126 110 126C124 126 130 106 122 106S116 126 130 126"/>
  <!-- leader -->
  <path class="sk-line" d="M127.5 46H156"/>
  <text x="160" y="49">tahini swirl</text>
  <text x="80" y="162" text-anchor="middle">two tins</text>
</svg>
